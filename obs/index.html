<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, initial-scale=1" />
<meta name="version" content="0.2.10">
<title>Empire X — Be Right Back</title>
<link rel="icon" type="image/png" href="/logo.png">

<!-- =====================================================================
     EMPIRE X · BRB OVERLAY
     Hosted at https://ourempirex.com/obs/
     Add as a 1920x1080 Browser Source in OBS.
===================================================================== -->
<script>
  const CONFIG = {
    // -------- ROSTER --------
    // Populated at runtime by fetch('/streamers.json') — see kickoff at the
    // bottom of this script. The JSON is the single source of truth for the
    // Confirmed Streamers list across ourempirex.com, /obs/, and /promo/.
    // To change the list, edit streamers.json (or use the admin CMS).
    //
    // v0.2.1 — schema is now [{slug, name}, ...] (was just [string, ...]).
    // The slug drives the kick.com API URL + iframe player URL (lowercase,
    // no spaces — must match the actual kick.com username). The name is
    // the display label shown on the tile. Bug pre-fix: the old schema
    // used `name` for everything, which 404'd for streamers with spaces
    // in their display name (e.g. "Ice Poseidon" → kick.com/api/.../ice
    // poseidon → 404). Now we use slug for URLs, name for visuals.
    ROSTER: [],

    // How often to re-check live status + viewer counts (ms).
    // 5 minutes (v0.2.8). The empire-worker keeps a 60s-warm KV cache
    // so polling faster than that just re-fetches the same data. And
    // since the BRB scene only ever shows the TOP 6 live streamers
    // (no rotation), a new streamer going live mid-stream only matters
    // if they crack the top 6 by viewer count — which doesn't happen
    // instantly. 5 minutes is plenty responsive AND keeps us well
    // under Cloudflare's 100k/day worker-request quota (5min × 34
    // channels ≈ 9,800 requests/day per active OBS instance).
    POLL_MS: 300_000,

    // If any streamers are live, how often the grid rotates through them
    // in groups of 6 (ms). Set high so viewers can settle in on a page.
    ROTATE_MS: 45_000,

    // -------- BACKGROUND VIDEOS --------
    VIDEOS_DIR: './videos/',
    VIDEOS_FALLBACK: ['empirexvideo.mp4'],
    VIDEO_OPACITY: 0.35,

    // -------- HEADER STAT --------
    // Shown between the top header and the grid. Right now it's a static
    // placeholder ("400 IN THE CHAT") until you wire it to real data.
    CHAT_COUNT_TEXT: '400 IN THE CHAT',

    // -------- PLAYER HOST (v0.2.1) --------
    // Which iframe host to use for the embedded streams. Default is
    // 'kick.com' (official). Alternative is 'kick.cx' — a third-party
    // mirror with a free embed (https://kick.cx/dev-stuff). Useful as
    // a manual fallback if Kick's official player is acting up.
    //
    // Override via URL param: /obs/?player=kick.cx
    // (No restart needed — the param is read on every iframe build.)
    PLAYER_HOST: 'kick.com',
  };

  // Honor the ?player= URL override at boot.
  try {
    const playerParam = new URLSearchParams(location.search).get('player');
    if (playerParam === 'kick.cx' || playerParam === 'kick.com') {
      CONFIG.PLAYER_HOST = playerParam;
    }
  } catch (e) { /* malformed URL — ignore */ }
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=JetBrains+Mono:wght@400;600&family=Inter+Tight:wght@400;500;700&display=swap');

  :root {
    --bg-0:       #070608;
    --bg-1:       #0d0b10;
    --bg-2:       #141118;
    --ink:        #f5efe1;
    --ink-dim:    #8a8275;
    --gold:       #d4a94a;
    --gold-hot:   #f2c764;
    --gold-dark:  #7a5f20;
    --kick:       #53fc18;
    --kick-glow:  #53fc1880;
    --danger:     #ff3b3b;
    --rule:       #2a2530;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--bg-0);
    color: var(--ink);
    font-family: 'Inter Tight', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- BACKGROUND VIDEO LAYER ---------- */
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
    opacity: 0;
    transition: opacity .9s ease;
    pointer-events: none;
  }
  .bg-video.visible { opacity: var(--video-opacity, .35); }

  .bg-veil {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 15% 20%, rgba(212,169,74,.18), transparent 45%),
      radial-gradient(ellipse at 85% 85%, rgba(212,169,74,.12), transparent 50%),
      radial-gradient(ellipse at 50% 50%, transparent 35%, rgba(7,6,8,.55) 80%, rgba(7,6,8,.85) 100%),
      linear-gradient(180deg, rgba(7,6,8,.35) 0%, rgba(13,11,16,.15) 50%, rgba(7,6,8,.45) 100%);
  }

  .bg-grain {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.9 0 0 0 0 0.8 0 0 0 0 0.5 0 0 0 0.5 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/%3E%3C/svg%3E");
    opacity: .06;
    mix-blend-mode: overlay;
  }

  .corner {
    position: fixed;
    /* Corners pulled OUTWARD toward viewport edges + sized smaller so
       they actually frame where the tile content sits. Was 180×180 at
       32px offset (corners framed an inner box much smaller than the
       actual tile grid); now 130×130 at 18px offset (corners sit
       closer to the edges and the framed area matches the content). */
    width: 130px; height: 130px;
    border: 1px solid var(--gold-dark);
    z-index: 4;
    pointer-events: none;
  }
  .corner::before {
    content: ''; position: absolute; background: var(--gold);
  }
  .corner.tl { top: 18px; left: 18px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 18px; right: 18px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 18px; left: 18px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 18px; right: 18px; border-left: 0; border-top: 0; }
  .corner.tl::before { top: -1px; left: 30px; width: 50px; height: 3px; }
  .corner.tr::before { top: -1px; right: 30px; width: 50px; height: 3px; }
  .corner.bl::before { bottom: -1px; left: 30px; width: 50px; height: 3px; }
  .corner.br::before { bottom: -1px; right: 30px; width: 50px; height: 3px; }

  .stage {
    position: relative;
    z-index: 5;
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: 1fr;
    /* rows: header · subtitle bar · content · footer
       v0.2.4 — tightened vertical budget to give the video grid more
       room. Was 132px / 52px / 1fr / 88px with 56px top padding +
       16px gaps. Now 118px / 44px / 1fr / 88px with 40px top padding
       + 12px gaps. Net ~52px more height for the video tiles below
       without crowding the header content (header internals fit in
       ~114px including margins). */
    grid-template-rows: 118px 44px 1fr 88px;
    padding: 40px 60px 56px;
    gap: 12px;
  }

  /* ---------- HEADER ---------- */
  header {
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
    /* Internal gap between eyebrow / EMPIREX / sub. Was 8 — tightened
       to 4 so the three-line stack reads as one unit instead of
       three loose siblings. */
    gap: 4px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    letter-spacing: .4em;
    color: var(--gold);
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(0,0,0,.8);
  }

  .mark {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 64px;
    letter-spacing: .18em;
    line-height: 1;
    background: linear-gradient(180deg, var(--gold-hot) 0%, var(--gold) 40%, var(--gold-dark) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 20px rgba(212,169,74,.3)) drop-shadow(0 2px 6px rgba(0,0,0,.9));
  }
  .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: .5em;
    color: var(--ink-dim);
    text-transform: uppercase;
    text-shadow: 0 0 8px rgba(0,0,0,.9);
  }

  /* ---------- SUBTITLE BAR ("TAPPED IN AND LIVE · 400 IN THE CHAT") ---------- */
  .subtitle-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }
  .subtitle-bar .divider {
    width: 1px; height: 28px; background: var(--gold-dark);
  }
  .subtitle-bar .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: .45em;
    color: var(--ink-dim);
    text-transform: uppercase;
    text-shadow: 0 0 8px rgba(0,0,0,.9);
    display: inline-flex; align-items: center; gap: 10px;
  }
  .subtitle-bar .chip {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 16px;
    border: 1px solid var(--gold-dark);
    background: rgba(7,6,8,.55);
    backdrop-filter: blur(4px);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: .3em;
    color: var(--gold);
    text-transform: uppercase;
  }
  .subtitle-bar .chip .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--kick);
    box-shadow: 0 0 8px var(--kick-glow);
    animation: pulse-green 1.4s ease-in-out infinite;
  }
  .subtitle-bar .chat-count {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: .2em;
    color: var(--gold-hot);
    text-shadow: 0 0 14px rgba(242,199,100,.4), 0 2px 6px rgba(0,0,0,.9);
  }

  @keyframes pulse-green {
    0%, 100% { opacity: 1; }
    50%      { opacity: .4; }
  }

  /* ---------- CONTENT (grid or waiting state) ---------- */
  .content { min-height: 0; display: grid; }

  /* Grid layouts adapt to the live count so tiles always fill the
     container width and stay centered, no matter how many are live.
     The `data-count` attribute on .grid drives which layout is picked. */
  .grid {
    display: grid;
    gap: 22px;
    min-height: 0;
    width: 100%;
    height: 100%;
    place-items: stretch;
    justify-content: center;
    align-content: center;
  }

  /* 1 live → one big hero tile, 16:9 aspect, centered.
     Constrain BY HEIGHT (the limiting dimension) so a single big tile
     never exceeds the content row. Width scales from the height. */
  .grid[data-count="1"] {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
    justify-items: center;
    align-items: center;
  }
  .grid[data-count="1"] > .tile {
    height: 100%;
    width: auto;
    aspect-ratio: 16 / 9;
    max-width: 100%;
    /* If width hits max-width (100% of col), height becomes the fixed dimension */
  }

  /* 2 live → two side-by-side. For two tiles to not overflow, each
     tile can be at most half the column width minus gap/2. We constrain
     width primarily and let aspect-ratio shrink height accordingly. */
  .grid[data-count="2"] {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: minmax(0, 1fr);
    justify-items: center;
    align-items: center;
    gap: 22px;
  }
  .grid[data-count="2"] > .tile {
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    max-height: 100%;
  }

  /* 3 live → three across. Same approach: width-first sizing. */
  .grid[data-count="3"] {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: minmax(0, 1fr);
    justify-items: center;
    align-items: center;
    gap: 22px;
  }
  .grid[data-count="3"] > .tile {
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    max-height: 100%;
  }
  /* 4 live → 2x2 grid */
  .grid[data-count="4"] {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
  }
  /* 5 live → top row of 3, bottom row of 2 centered */
  .grid[data-count="5"] {
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
  }
  .grid[data-count="5"] > .tile:nth-child(1) { grid-column: 1 / span 2; grid-row: 1; }
  .grid[data-count="5"] > .tile:nth-child(2) { grid-column: 3 / span 2; grid-row: 1; }
  .grid[data-count="5"] > .tile:nth-child(3) { grid-column: 5 / span 2; grid-row: 1; }
  .grid[data-count="5"] > .tile:nth-child(4) { grid-column: 2 / span 2; grid-row: 2; }
  .grid[data-count="5"] > .tile:nth-child(5) { grid-column: 4 / span 2; grid-row: 2; }
  /* 6+ live → classic 3x2 */
  .grid[data-count="6"] {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
  }

  .tile {
    position: relative;
    background: var(--bg-2);
    border: 1px solid var(--rule);
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow:
      0 0 0 1px rgba(212,169,74,.12) inset,
      0 24px 48px -24px rgba(0,0,0,.9);
    opacity: 0;
    animation: tile-in .7s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .tile:nth-child(1) { animation-delay: .05s; }
  .tile:nth-child(2) { animation-delay: .12s; }
  .tile:nth-child(3) { animation-delay: .19s; }
  .tile:nth-child(4) { animation-delay: .26s; }
  .tile:nth-child(5) { animation-delay: .33s; }
  .tile:nth-child(6) { animation-delay: .40s; }
  @keyframes tile-in {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .tile::before {
    content: '';
    position: absolute; inset: 6px;
    border: 1px solid rgba(212,169,74,.22);
    pointer-events: none; z-index: 2;
  }

  .tile .live-badge {
    position: absolute; top: 12px; right: 12px;
    z-index: 4;
    display: flex; align-items: center; gap: 8px;
    background: rgba(7,6,8,.85);
    backdrop-filter: blur(6px);
    padding: 5px 10px;
    border: 1px solid var(--kick);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: .2em;
    color: var(--kick);
  }
  .tile .live-badge::before {
    content: '';
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--kick);
    box-shadow: 0 0 8px var(--kick-glow);
    animation: pulse-green 1.4s ease-in-out infinite;
  }

  .tile .viewers-badge {
    position: absolute; top: 12px; left: 12px;
    z-index: 4;
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(7,6,8,.85);
    backdrop-filter: blur(6px);
    padding: 5px 10px;
    border: 1px solid var(--gold-dark);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: .2em;
    color: var(--gold);
  }
  .tile .viewers-badge::before {
    content: '';
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 6px var(--gold);
  }

  /* ---------- FEATURED TILE (the one with audio on) ---------- */
  .tile-featured {
    box-shadow:
      0 0 0 2px var(--gold-hot) inset,
      0 0 40px rgba(242,199,100,.25),
      0 24px 48px -24px rgba(0,0,0,.9) !important;
    animation: tile-in .7s cubic-bezier(.2,.7,.2,1) forwards, featured-glow 2.4s ease-in-out infinite;
  }
  .tile-featured::before {
    border-color: rgba(242,199,100,.55) !important;
  }
  @keyframes featured-glow {
    0%, 100% { box-shadow:
      0 0 0 2px var(--gold-hot) inset,
      0 0 40px rgba(242,199,100,.25),
      0 24px 48px -24px rgba(0,0,0,.9); }
    50%      { box-shadow:
      0 0 0 2px var(--gold-hot) inset,
      0 0 60px rgba(242,199,100,.45),
      0 24px 48px -24px rgba(0,0,0,.9); }
  }

  .tile .audio-badge {
    position: absolute;
    top: 52px; right: 12px;  /* sits just below the LIVE badge */
    z-index: 4;
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(242,199,100,.95);
    color: #1a1208;
    padding: 5px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 700;
    letter-spacing: .2em;
    box-shadow: 0 0 14px rgba(242,199,100,.6);
  }
  .tile .audio-badge .audio-icon {
    font-size: 14px;
    display: inline-block;
    animation: audio-wave 1s ease-in-out infinite;
  }
  @keyframes audio-wave {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(1.3); }
  }

  /* Audio toggle button — sits in the bottom-right of each tile's
     embed area. Clicking makes THIS tile the audio source (mutes
     whichever tile was previously unmuted). The "single-source radio"
     model fits OBS use: only one stream's audio playing at a time. */
  .tile .audio-toggle {
    position: absolute;
    bottom: 56px; right: 12px;  /* above the .bar (info strip) */
    z-index: 5;                  /* over the iframe */
    width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(10,10,10,.72);
    color: #f5f1eb;
    border: 1px solid rgba(245,241,235,.18);
    border-radius: 6px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: background .15s ease, border-color .15s ease, color .15s ease;
    padding: 0;
    line-height: 0;
  }
  .tile .audio-toggle:hover {
    background: rgba(10,10,10,.92);
    border-color: rgba(242,199,100,.6);
    color: #f2c764;
  }
  .tile.tile-featured .audio-toggle {
    /* On the currently-playing tile the button glows gold so the user
       can see at a glance which stream has audio. */
    background: rgba(242,199,100,.95);
    color: #1a1208;
    border-color: transparent;
    box-shadow: 0 0 12px rgba(242,199,100,.5);
  }
  .tile.tile-featured .audio-toggle:hover {
    background: rgba(242,199,100,1);
    color: #1a1208;
  }
  .tile .audio-toggle svg {
    width: 18px; height: 18px;
    display: block;
    pointer-events: none;  /* click on icon bubbles to the button */
  }

  .tile .embed {
    position: relative;
    flex: 1;
    background: #000;
    overflow: hidden;
  }
  .tile .embed iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0;
  }

  .tile .placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1a1520 0%, #0c0a10 100%);
    color: var(--ink-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: .25em;
    text-transform: uppercase;
  }

  .tile .bar {
    position: relative;
    z-index: 3;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    background: linear-gradient(180deg, rgba(15,12,19,.95) 0%, rgba(9,7,11,.98) 100%);
    border-top: 1px solid var(--rule);
  }

  .tile .kick-logo {
    flex-shrink: 0;
    width: 30px; height: 30px;
    background: var(--kick);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 14px var(--kick-glow);
  }
  .tile .kick-logo svg { width: 20px; height: 20px; }

  .tile .who {
    display: flex; flex-direction: column; gap: 2px;
    min-width: 0;
  }
  .tile .name {
    font-family: 'Inter Tight', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: .02em;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tile .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: .2em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .tile .meta .platform { color: var(--kick); }

  /* ---------- LOADING / WAITING STATES ---------- */
  .waiting {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px;
    color: var(--ink-dim);
    text-align: center;
    padding: 60px;
  }
  .waiting .big {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 44px;
    letter-spacing: .25em;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(212,169,74,.4);
  }
  .waiting .sub-line {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; letter-spacing: .3em;
    text-transform: uppercase;
    max-width: 900px; line-height: 1.8;
  }
  .waiting .spinner {
    width: 40px; height: 40px;
    border: 2px solid var(--gold-dark);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- FOOTER ---------- */
  footer {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 40px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: .3em;
    color: var(--ink-dim);
    text-transform: uppercase;
    text-shadow: 0 0 8px rgba(0,0,0,.9);
  }
  footer .right { text-align: right; }

  .rotation-progress {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-hot));
    width: 0%;
    z-index: 10;
    box-shadow: 0 0 8px rgba(212,169,74,.6);
  }

  /* ---------- UPTIME COUNTER + VERSION (lower-left)
     Lightweight indicator of how long the BRB page has been mounted
     since last refresh — useful for spotting stuck/stale OBS scenes
     without having to F5 the page to find out. Discreet styling so
     it doesn't compete with the streamer grid for attention. */
  .uptime-counter {
    position: fixed;
    left: 22px;
    bottom: 18px;
    /* Bumped 5 → 12 alongside .multikick-btn so the lower edge of the
       screen (where `.stage`'s footer lives) doesn't paint over the
       indicator. */
    z-index: 12;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--ink-dim);
    text-shadow: 0 0 8px rgba(0,0,0,.9);
    pointer-events: none;
  }
  .uptime-counter .uptime-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 6px rgba(212,169,74,.6);
    animation: uptime-pulse 2s ease-in-out infinite;
  }
  .uptime-counter .uptime-label {
    color: var(--ink-dim);
    opacity: .7;
  }
  .uptime-counter .uptime-value {
    color: var(--gold);
    font-weight: 600;
    letter-spacing: .15em;
  }
  /* Version segment lives inline with the uptime counter, separated by
     a thin vertical divider. Same dim/gold treatment as the uptime
     value so the lower-left strip reads as a single status row. */
  .uptime-counter .uptime-divider {
    width: 1px;
    height: 10px;
    background: var(--rule);
    margin: 0 4px;
    opacity: .8;
  }
  .uptime-counter .v-prefix { color: var(--ink-dim); opacity: .65; }
  .uptime-counter .v-num    { color: var(--gold); font-weight: 600; letter-spacing: .15em; }
  @keyframes uptime-pulse {
    0%, 100% { opacity: .35; }
    50%      { opacity: 1; }
  }

  /* ---------- MANUAL REFRESH BUTTON (above the uptime counter)
     Clicking forces a fresh poll() of the kick.com API without
     reloading the page — useful if the embedded grid is stuck and
     the operator wants to nudge live-status detection without
     losing OBS scene state. Sits just above the uptime row in the
     lower-left so the lower-left status block reads top-down as
     [↻ refresh] / [● uptime + version]. */
  .refresh-btn {
    position: fixed;
    left: 22px;
    bottom: 44px;
    z-index: 12;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px 4px 6px;
    border: 1px solid var(--rule);
    background: linear-gradient(135deg, rgba(15,12,19,.85), rgba(9,7,11,.92));
    color: var(--ink-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: .25em;
    text-transform: uppercase;
    cursor: pointer;
    pointer-events: auto;
    text-shadow: 0 0 6px rgba(0,0,0,.9);
    transition: opacity .2s, border-color .2s, color .2s;
    opacity: .6;
  }
  .refresh-btn:hover {
    opacity: 1;
    border-color: var(--gold-dark);
    color: var(--gold);
  }
  .refresh-btn .refresh-icon {
    width: 11px; height: 11px;
    display: inline-block;
    line-height: 11px;
    text-align: center;
    font-size: 13px;
    transform-origin: center;
  }
  .refresh-btn.is-spinning .refresh-icon {
    animation: refresh-spin 700ms linear infinite;
    color: var(--gold);
  }
  .refresh-btn.is-spinning {
    border-color: var(--gold-dark);
    opacity: 1;
  }
  @keyframes refresh-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ---------- MULTIKICK ESCAPE-HATCH BUTTON (bottom-center)
     One-click fallback if the embedded grid is acting up. Dynamically
     rebuilt from currently-known live slugs so the URL is always
     `https://multikick.com/slug1/slug2/...`. Hidden when no live
     streamers are known (clicking would lead to a blank page). */
  .multikick-btn {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    /* z-index bumped to 12 — was 5, same as `.stage`. Since `.stage`
       comes AFTER the button in the DOM, equal z-index meant `.stage`
       (which contains the footer in the bottom 88px) painted ON TOP
       of the button and silently swallowed all click events. Now
       above the rotation-progress bar (10) too so it's never
       obscured. */
    z-index: 12;
    cursor: pointer;
    pointer-events: auto;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border: 1px solid var(--gold-dark);
    background: linear-gradient(135deg, rgba(15,12,19,.92), rgba(9,7,11,.95));
    color: var(--gold);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .25em;
    text-transform: uppercase;
    text-decoration: none;
    text-shadow: 0 0 6px rgba(212,169,74,.4);
    transition: opacity .2s, border-color .2s, color .2s;
    opacity: .65;
    backdrop-filter: blur(2px);
  }
  .multikick-btn.visible { display: inline-flex; }
  .multikick-btn:hover {
    opacity: 1;
    border-color: var(--gold);
    color: var(--gold-hot);
  }
  .multikick-btn .mk-icon {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 6px rgba(212,169,74,.6);
  }
</style>
</head>
<body>

<!-- Two video elements for crossfade shuffle -->
<video class="bg-video" id="bgA" muted playsinline preload="auto"></video>
<video class="bg-video" id="bgB" muted playsinline preload="auto"></video>

<div class="bg-veil"></div>
<div class="bg-grain"></div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="rotation-progress" id="rotationProgress"></div>

<!-- MultiKick escape-hatch button (bottom-center) — links to
     multikick.com with all currently-live slugs in the path so the
     operator can switch to MultiKick's grid in one click if the
     embedded grid here is acting up. Hidden until at least one
     streamer is known to be live. -->
<a class="multikick-btn" id="multikickBtn" href="https://multikick.com/" target="_blank" rel="noopener" aria-hidden="true">
  <span class="mk-icon"></span>
  <span class="mk-label">Failing? Load MultiKick</span>
</a>

<!-- Manual refresh button — sits above the uptime counter. Click to
     re-poll Kick live status without reloading the page (preserves
     OBS scene state + uptime counter). Useful when streams seem
     stuck or proxies were timing out and the operator wants to
     nudge things without an F5. -->
<button type="button" class="refresh-btn" id="refreshBtn" title="Re-poll live status">
  <span class="refresh-icon">↻</span>
  <span>Refresh</span>
</button>

<!-- Uptime counter + version (lower-left). Uptime ticks every second
     from page load (format MM:SS auto-promotes to HH:MM:SS at 1h).
     Version sits to the right of the uptime, separated by a thin
     divider, so OBS operators can confirm which build is loading. -->
<div class="uptime-counter" aria-hidden="true">
  <span class="uptime-dot"></span>
  <span class="uptime-label">Uptime</span>
  <span class="uptime-value" id="uptimeValue">00:00</span>
  <span class="uptime-divider"></span>
  <span class="v-prefix">OBS </span><span class="v-num">v0.2.10</span>
</div>

<div class="stage">

  <header>
    <div class="eyebrow">The Party Never Stops</div>
    <div class="mark">EMPIRE X</div>
    <div class="sub">PROJECTX MEETS IRL STREAMING LIVE</div>
  </header>

  <div class="subtitle-bar">
    <span class="chip"><span class="dot"></span>TAPPED IN AND LIVE</span>
    <span class="divider"></span>
    <span class="chat-count" id="chatCount">400 IN THE CHAT</span>
    <span class="divider"></span>
    <span class="label" id="liveSummary">— Live —</span>
  </div>

  <div class="content" id="content">
    <div class="waiting">
      <div class="spinner"></div>
      <div class="big">400.</div>
      <div class="sub-line">Checking for other streams live…</div>
    </div>
  </div>

  <footer>
    <div class="left">ourempirex.com</div>
    <div class="right">Stream switches back shortly</div>
  </footer>

</div>

<script>
  document.documentElement.style.setProperty('--video-opacity', CONFIG.VIDEO_OPACITY);

  /* ==================================================================
     UPTIME COUNTER — ticks every 1s. Useful for spotting frozen/stuck
     OBS browser sources at a glance. Format auto-promotes:
        < 1h: MM:SS
        ≥ 1h: HH:MM:SS
  ================================================================== */
  (function () {
    const startedAt = Date.now();
    const el = document.getElementById('uptimeValue');
    if (!el) return;
    function pad2(n) { return n < 10 ? '0' + n : '' + n; }
    function tick() {
      const s = Math.floor((Date.now() - startedAt) / 1000);
      const hh = Math.floor(s / 3600);
      const mm = Math.floor((s % 3600) / 60);
      const ss = s % 60;
      el.textContent = hh > 0
        ? pad2(hh) + ':' + pad2(mm) + ':' + pad2(ss)
        : pad2(mm) + ':' + pad2(ss);
    }
    tick();
    setInterval(tick, 1000);
  })();

  /* ==================================================================
     MANUAL REFRESH BUTTON wiring. Re-runs poll() when clicked. Spins
     the icon while a poll is in flight + disables re-clicks until
     the in-flight poll resolves so impatient mashing doesn't queue
     up a stack of overlapping polls.
  ================================================================== */
  (function () {
    const btn = document.getElementById('refreshBtn');
    if (!btn) return;
    let polling = false;
    btn.addEventListener('click', async function () {
      if (polling) return;
      // poll() is defined later in the same script; reference it via
      // window so the closure resolves at click-time, not load-time.
      if (typeof window.poll !== 'function') {
        console.warn('[BRB] refresh clicked but poll() not yet ready');
        return;
      }
      polling = true;
      btn.classList.add('is-spinning');
      try {
        await window.poll();
      } catch (e) {
        console.warn('[BRB] manual refresh failed:', e);
      } finally {
        polling = false;
        btn.classList.remove('is-spinning');
      }
    });
  })();

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function fmtViewers(n) {
    if (n == null) return '—';
    if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
    if (n >= 1_000)     return (n / 1_000).toFixed(n >= 10_000 ? 0 : 1) + 'K';
    return String(n);
  }

  /* ==================================================================
     BACKGROUND VIDEO — shuffle through videos/*.mp4, crossfade between
     two <video> elements so there's never a black flash.
  ================================================================== */
  const videoA = document.getElementById('bgA');
  const videoB = document.getElementById('bgB');
  let activeVideo = videoA;
  let inactiveVideo = videoB;
  let videoQueue = [];
  let videoList = [];

  async function discoverVideos() {
    try {
      const r = await fetch(`${CONFIG.VIDEOS_DIR}videos.json?t=${Date.now()}`, { cache: 'no-store' });
      if (r.ok) {
        const j = await r.json();
        if (Array.isArray(j.videos) && j.videos.length) return j.videos;
      }
    } catch (_) {}
    return CONFIG.VIDEOS_FALLBACK;
  }

  function nextVideoSrc() {
    if (videoQueue.length === 0) videoQueue = shuffle(videoList);
    const filename = videoQueue.shift();
    return filename ? `${CONFIG.VIDEOS_DIR}${filename}` : null;
  }

  function swapToNextVideo() {
    const src = nextVideoSrc();
    if (!src) return;

    inactiveVideo.src = src;
    inactiveVideo.load();
    inactiveVideo.oncanplay = () => {
      inactiveVideo.play().catch(() => {});
      inactiveVideo.classList.add('visible');
      activeVideo.classList.remove('visible');

      setTimeout(() => {
        activeVideo.pause();
        activeVideo.removeAttribute('src');
        activeVideo.load();
        [activeVideo, inactiveVideo] = [inactiveVideo, activeVideo];
      }, 1000);
    };
  }

  async function startBackgroundVideos() {
    videoList = await discoverVideos();
    if (!videoList || videoList.length === 0) return;
    videoQueue = shuffle(videoList);

    const first = nextVideoSrc();
    activeVideo.src = first;
    activeVideo.load();
    activeVideo.oncanplay = () => {
      activeVideo.play().catch(() => {});
      activeVideo.classList.add('visible');
    };

    videoA.addEventListener('ended', swapToNextVideo);
    videoB.addEventListener('ended', swapToNextVideo);
  }

  startBackgroundVideos();

  /* ==================================================================
     KICK LIVE STATUS — uses the same method as ourempirex.com's
     Confirmed Streamers section: fetch `kick.com/api/v2/channels/{slug}`
     through a public CORS proxy. The response has a `livestream` object
     (null if offline) with `viewer_count`, `session_title`, etc.
  ================================================================== */
  // Live-status fetch (v0.2.9+):
  //
  // ONE request to empire-worker's /live endpoint returns the snapshot
  // of every channel in the roster. Was 34 separate requests per poll
  // (one per slug, racing 4 proxies each = 136 outbound requests per
  // poll cycle). With multiple OBS instances active, that was burning
  // through the Cloudflare 100k/day worker-request quota fast.
  //
  // Snapshot shape:
  //   {
  //     generated_at: <ms>,
  //     roster_size: 34,
  //     channels: {
  //       "<slug>": { isLive: bool, viewers: N, title: string },
  //       ...
  //     }
  //   }
  //
  // Fallback: if the snapshot fetch fails entirely (worker down, network
  // hiccup), we return an "unknown" result for every slug — the existing
  // proxy-outage detection in poll() then keeps whatever's currently on
  // screen rather than wiping to "warming up". No public-CORS-proxy
  // fallback anymore: Kick's bot protection blocks them so reliably
  // that they were essentially never returning anything useful.
  const WORKER_LIVE_URL = 'https://empire-worker.sevendwarfs.workers.dev/live';

  async function fetchAllLive() {
    let snapshot = null;
    try {
      const res = await fetch(WORKER_LIVE_URL, {
        signal: AbortSignal.timeout(10000),
        cache: 'no-cache',
      });
      if (!res.ok) throw new Error('http ' + res.status);
      snapshot = await res.json();
    } catch (e) {
      console.warn('[BRB] /live fetch failed:', e && e.message || e);
      // Return all-unknown so the proxy-outage path kicks in and
      // current grid stays put.
      return CONFIG.ROSTER.map(entry => ({
        slug: entry.slug,
        name: entry.name,
        isLive: false,
        viewers: 0,
        title: '',
        known: false,
      }));
    }

    const channels = (snapshot && snapshot.channels) || {};
    return CONFIG.ROSTER.map(entry => {
      const ch = channels[entry.slug.toLowerCase()];
      // A slug present in the snapshot is a "known" result (worker
      // confirmed the state, whether live or offline). A slug missing
      // from the snapshot means the cron couldn't reach Kick for that
      // one — treat as unknown so the outage detection has a signal.
      if (ch) {
        return {
          slug: entry.slug,
          name: entry.name,
          isLive: !!ch.isLive,
          viewers: Number(ch.viewers || 0),
          title: ch.title || '',
          known: true,
        };
      }
      return {
        slug: entry.slug,
        name: entry.name,
        isLive: false,
        viewers: 0,
        title: '',
        known: false,
      };
    });
  }

  // localStorage cache so the page shows the last-known live grid
  // INSTANTLY on load while fresh polling happens in the background.
  //
  // v0.2.1 — TTL bumped 5 min → 30 min. The 5-min ceiling was wiping
  // perfectly-good cached state during brief CORS-proxy outages and
  // leaving the BRB scene stuck on "WARMING UP" even though the cache
  // had a known-live grid only minutes old. 30 min strikes a better
  // balance: long enough to ride through proxy hiccups without losing
  // the screen, short enough that a streamer who's truly been offline
  // for half an hour falls out.
  const LIVE_CACHE_KEY = 'obs-live-cache-v1';
  const LIVE_CACHE_TTL_MS = 30 * 60 * 1000;
  function saveLiveCache(results) {
    try {
      localStorage.setItem(LIVE_CACHE_KEY, JSON.stringify({
        ts: Date.now(),
        results: results.filter(r => r && r.isLive),
      }));
    } catch (e) { /* quota / private mode — ignore */ }
  }
  function loadLiveCache() {
    try {
      const raw = localStorage.getItem(LIVE_CACHE_KEY);
      if (!raw) return null;
      const c = JSON.parse(raw);
      if (Date.now() - c.ts > LIVE_CACHE_TTL_MS) return null;
      return c.results;
    } catch (e) { return null; }
  }

  /* ==================================================================
     GRID — render only live streamers, ordered by viewer count desc.
     No ranking numbers. If more than 6 live, rotate through pages of 6.
  ================================================================== */
  const content = document.getElementById('content');
  const liveSummary = document.getElementById('liveSummary');
  const rotationProgress = document.getElementById('rotationProgress');

  // Event delegation for the per-tile audio-toggle buttons. One listener
  // on `content` catches clicks on any .audio-toggle inside any tile,
  // regardless of when the tile was created or removed (tiles get
  // created/destroyed on every poll). Sets the user's pick + re-renders
  // so the audio source actually swaps.
  content.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-audio-toggle]');
    if (!btn) return;
    const slug = btn.getAttribute('data-audio-toggle');
    if (!slug) return;
    // Clicking the already-playing tile is a no-op (avoid an iframe
    // reload that would mute then immediately re-unmute the same
    // stream). The user can't "unmute none" — there's always exactly
    // one audio source at a time.
    if (slug === userPickedAudioSlug) return;
    const currentPage = livePages[currentPageIdx] || [];
    const currentSource = audioSourceFor(currentPage);
    if (slug === currentSource && !userPickedAudioSlug) {
      // The user clicked whatever happens to be the auto-pick. Persist
      // it as a manual pick so subsequent viewer-count shifts don't
      // bump them off this stream's audio.
      saveAudioPick(slug);
      return;
    }
    saveAudioPick(slug);
    renderPage(currentPageIdx);
  });

  const KICK_SVG = `
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="#000" d="M3 3h5v6h3V6h3V3h5v6h-3v3h-3v3h3v3h3v3h-5v-3h-3v-3H8v6H3z"/>
    </svg>`;

  // Audio source state (v0.2.10+).
  //   "Single-source radio" — exactly one tile is unmuted at a time.
  //   Default: top streamer by viewer count (auto-pick).
  //   Override: clicking the speaker icon on any tile sets that tile
  //   as the audio source. The choice persists across polls AND across
  //   page reloads (via localStorage) so an OBS browser-source refresh
  //   doesn't lose the operator's pick.
  //   Fallback: if the user-picked streamer goes offline, audio falls
  //   back to top-by-viewers — but the manual pick is remembered, so
  //   when that streamer comes back online they reclaim audio.
  const AUDIO_PICK_KEY = 'obs-audio-pick-v1';
  let userPickedAudioSlug = (() => {
    try {
      return localStorage.getItem(AUDIO_PICK_KEY) || null;
    } catch { return null; }
  })();
  function saveAudioPick(slug) {
    userPickedAudioSlug = slug || null;
    try {
      if (slug) localStorage.setItem(AUDIO_PICK_KEY, slug);
      else localStorage.removeItem(AUDIO_PICK_KEY);
    } catch { /* private mode etc — ignore */ }
  }
  // Given the current page, pick the slug that should have audio.
  // Prefers the user's manual pick if that streamer is still on the
  // page; otherwise auto-picks the top-by-viewers (page[0]).
  function audioSourceFor(page) {
    if (!page || page.length === 0) return null;
    if (userPickedAudioSlug && page.some(s => s.slug === userPickedAudioSlug)) {
      return userPickedAudioSlug;
    }
    return page[0].slug;
  }

  // Speaker icons used by the per-tile audio-toggle button. SVG so
  // they scale cleanly + can inherit currentColor (the gold/cream
  // states are handled by CSS).
  const SPEAKER_ON_SVG =
    '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
      '<path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12z"/>' +
      '<path d="M14 4.23v2.06A6.97 6.97 0 0 1 19 12a6.97 6.97 0 0 1-5 5.71v2.06A8.97 8.97 0 0 0 21 12 8.97 8.97 0 0 0 14 4.23z" opacity="0.85"/>' +
    '</svg>';
  const SPEAKER_OFF_SVG =
    '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
      '<path d="M3 10v4h4l5 4V6L7 10H3z"/>' +
      // X mark to indicate muted
      '<path d="M16.5 9.5 L21 14M21 9.5 L16.5 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>' +
    '</svg>';

  function tileHTML(s, opts = {}) {
    // slug = kick.com URL slug (lowercase, no spaces) for iframe + API
    // name = display label shown on the card. Falls back to slug if
    //   the entry doesn't carry a display name (e.g. legacy cache rows
    //   from v0.2.0 had only `username`).
    const slug = s.slug || s.username;
    const name = s.name || s.username || slug;
    const isTop = !!opts.isTop;
    // The "audio source" tile plays with audio unmuted. All others
    // stay muted so the scene isn't chaos. Kick's player accepts
    // `muted=false` as the signal to play audio.
    const muted = isTop ? 'false' : 'true';
    // v0.2.1 — host is configurable. Default = official player.kick.com.
    // Alternative = player.kick.cx (third-party free embed). The
    // ?muted= param is honored by both. kick.cx accepts more URL
    // options (?volume=false &c.) but autoplay+muted is enough.
    const playerHost = CONFIG.PLAYER_HOST === 'kick.cx'
      ? 'player.kick.cx'
      : 'player.kick.com';
    const src = `https://${playerHost}/${encodeURIComponent(slug)}?autoplay=true&muted=${muted}`;
    const audioBadge = isTop
      ? '<div class="audio-badge"><span class="audio-icon">♪</span>AUDIO LIVE</div>'
      : '';
    const tileClass = isTop ? 'tile tile-featured' : 'tile';
    const audioBtnLabel = isTop ? 'Currently playing audio' : 'Play this stream’s audio';
    const audioBtn = `
      <button class="audio-toggle" data-audio-toggle="${slug}" type="button"
              aria-label="${audioBtnLabel}" title="${audioBtnLabel}">
        ${isTop ? SPEAKER_ON_SVG : SPEAKER_OFF_SVG}
      </button>`;
    return `
      <div class="${tileClass}">
        <div class="viewers-badge">${fmtViewers(s.viewers)} VIEWERS</div>
        <div class="live-badge">LIVE</div>
        ${audioBadge}
        <div class="embed">
          <div class="placeholder">Loading ${name}…</div>
          <iframe
            data-streamer="${slug}"
            data-featured="${isTop}"
            src="${src}"
            allow="autoplay; fullscreen; encrypted-media"
            allowfullscreen
            scrolling="no"
            frameborder="0"></iframe>
          ${audioBtn}
        </div>
        <div class="bar">
          <div class="kick-logo" title="Kick">${KICK_SVG}</div>
          <div class="who">
            <div class="name">${name}</div>
            <div class="meta">Live on <span class="platform">Kick</span></div>
          </div>
        </div>
      </div>`;
  }

  function renderWaiting(msg, sub) {
    content.innerHTML = `
      <div class="waiting">
        <div class="spinner"></div>
        <div class="big">${msg}</div>
        <div class="sub-line">${sub}</div>
      </div>`;
  }

  function renderNoneLive() {
    // Party vibe — no "Arena is Quiet" doom. Keep it light.
    content.innerHTML = `
      <div class="waiting">
        <div class="big">WARMING UP</div>
        <div class="sub-line">
          The network is live soon. Hang tight — the first streamers go live any minute.
        </div>
      </div>`;
  }

  // Pagination state
  let livePages = [];           // array of arrays (each of length ≤ 6)
  let currentPageIdx = 0;
  let rotateTimer = null;

  // Build a single tile DOM node from the HTML template above.
  function buildTile(s, isTop) {
    const wrap = document.createElement('div');
    wrap.innerHTML = tileHTML(s, { isTop }).trim();
    return wrap.firstElementChild;
  }

  // DOM-DIFFING render. Critical for stopping the iframe-blackout lag:
  // previously this function set content.innerHTML = entire grid markup
  // every poll, which destroyed + recreated EVERY iframe — so when a
  // 2nd live streamer was discovered 5s after the 1st, the 1st's iframe
  // would tear down + reload, going black for ~3 seconds.
  //
  // Strategy: index existing tiles by data-streamer, only inject brand
  // new ones, only remove tiles whose streamer is no longer in this
  // page, reorder via insertBefore as viewer counts shift. iframes
  // owned by tiles that survive a re-render are NOT touched — they
  // keep playing without blackout.
  function renderPage(idx) {
    const page = livePages[idx];
    if (!page || page.length === 0) return;
    const count = Math.min(page.length, 6);
    // Tile-key resolver — slug is the canonical key, but legacy cache
    // entries (saved by v0.2.0 before the refactor) only carry
    // `username`. Fall back so a stale cache from before the upgrade
    // still renders without thrashing the DOM.
    const tileKey = s => s.slug || s.username;
    // v0.2.10 — the "featured" (audio-source) tile is no longer
    // hard-wired to page[0]. audioSourceFor() returns either the
    // user's manually-picked slug (if still on the page) or page[0]
    // as the auto-pick fallback. The rest of renderPage uses this
    // same `isTopSlug` variable so swapping it here is enough.
    const isTopSlug = audioSourceFor(page);

    // First-time mount: create the grid element fresh
    let grid = content.querySelector('.grid');
    if (!grid) {
      grid = document.createElement('div');
      grid.className = 'grid';
      grid.dataset.count = count;
      content.innerHTML = '';
      content.appendChild(grid);
    } else {
      grid.dataset.count = count;
    }

    // Map currently-mounted tiles by streamer name so we can reuse them.
    const existing = new Map();
    grid.querySelectorAll('.tile').forEach(t => {
      const iframe = t.querySelector('iframe');
      if (iframe && iframe.dataset.streamer) {
        existing.set(iframe.dataset.streamer, t);
      }
    });

    // Set of streamers we WANT mounted on this page (keyed by slug,
    // matches data-streamer attribute set in tileHTML)
    const wanted = new Set(page.map(s => s.slug));

    // Drop tiles for streamers not on this page (offline, rotated off, etc.)
    for (const [name, tile] of existing) {
      if (!wanted.has(name)) {
        tile.remove();
        existing.delete(name);
      }
    }

    // For each desired streamer in order, reuse OR create + position
    for (let i = 0; i < page.length; i++) {
      const s = page[i];
      const isTop = s.slug === isTopSlug;
      let tile = existing.get(s.slug);

      if (tile) {
        // EXISTING tile — update viewer badge in place, no iframe reload
        const vb = tile.querySelector('.viewers-badge');
        if (vb) vb.textContent = `${fmtViewers(s.viewers)} VIEWERS`;
        // Featured-flip handling (top streamer changed). v0.2.7 — also
        // swap the iframe src so the AUDIO LIVE badge tells the truth.
        // Previous behavior: badge + class moved, but iframe URL still
        // carried the old muted=true/false — so the tile labelled
        // "AUDIO LIVE" was actually silent (and a different tile was
        // unmuted invisibly). Reloading the iframe costs a brief
        // blackout but accurate audio matters more than zero-blackout
        // re-sorts on the BRB scene.
        // Only the affected tile(s) reload — other tiles' iframes stay
        // alive because they're not being touched.
        const wasFeatured = tile.classList.contains('tile-featured');
        if (isTop !== wasFeatured) {
          tile.classList.toggle('tile-featured', isTop);
          // Add/remove audio badge text DOM
          const existingBadge = tile.querySelector('.audio-badge');
          if (isTop && !existingBadge) {
            const ab = document.createElement('div');
            ab.className = 'audio-badge';
            ab.innerHTML = '<span class="audio-icon">♪</span>AUDIO LIVE';
            tile.insertBefore(ab, tile.querySelector('.embed'));
          } else if (!isTop && existingBadge) {
            existingBadge.remove();
          }
          // Reload the iframe with the new muted= value so audio
          // actually follows the AUDIO LIVE badge.
          const iframe = tile.querySelector('iframe');
          if (iframe) {
            const newMuted = isTop ? 'false' : 'true';
            const newSrc = iframe.src.replace(/muted=(true|false)/, 'muted=' + newMuted);
            if (newSrc !== iframe.src) {
              iframe.src = newSrc;
              iframe.dataset.featured = String(isTop);
            }
          }
          // Swap the audio-toggle button's speaker icon (on / off) and
          // its hover tooltip so the UI matches reality. CSS handles
          // the gold-glow state via .tile-featured selector — we only
          // need to swap the SVG payload here.
          const btn = tile.querySelector('.audio-toggle');
          if (btn) {
            btn.innerHTML = isTop ? SPEAKER_ON_SVG : SPEAKER_OFF_SVG;
            const lbl = isTop ? 'Currently playing audio' : 'Play this stream’s audio';
            btn.setAttribute('aria-label', lbl);
            btn.setAttribute('title', lbl);
          }
        }
      } else {
        // NEW tile — build + insert at correct grid position
        tile = buildTile(s, isTop);
      }

      // Position correctly. insertBefore moves an existing node if it's
      // already attached — no DOM destruction, iframe stays alive.
      const desiredIdx = i;
      const currentChild = grid.children[desiredIdx];
      if (currentChild !== tile) {
        grid.insertBefore(tile, currentChild || null);
      }
    }
  }

  function startRotation() {
    if (rotateTimer) clearInterval(rotateTimer);
    renderPage(currentPageIdx);
    resetProgressBar();

    if (livePages.length > 1) {
      rotateTimer = setInterval(() => {
        currentPageIdx = (currentPageIdx + 1) % livePages.length;
        renderPage(currentPageIdx);
        resetProgressBar();
      }, CONFIG.ROTATE_MS);
    }
  }

  function resetProgressBar() {
    if (livePages.length <= 1) {
      rotationProgress.style.width = '0%';
      return;
    }
    rotationProgress.style.transition = 'none';
    rotationProgress.style.width = '0%';
    void rotationProgress.offsetWidth;
    rotationProgress.style.transition = `width ${CONFIG.ROTATE_MS}ms linear`;
    rotationProgress.style.width = '100%';
  }

  function updateSummary(liveCount, totalViewers) {
    const viewers = fmtViewers(totalViewers);
    liveSummary.textContent = liveCount === 0
      ? '— Warming Up —'
      : `— ${liveCount} Live · ${viewers} Viewers —`;
  }

  // v0.2.1 — keep the MultiKick fallback button URL in sync with the
  // current live grid. URL is `multikick.com/slug1/slug2/...`. Hidden
  // when nothing is live (clicking would land on a blank multikick).
  function updateMultiKickButton(live) {
    const btn = document.getElementById('multikickBtn');
    if (!btn) return;
    if (!live || live.length === 0) {
      btn.classList.remove('visible');
      btn.setAttribute('aria-hidden', 'true');
      btn.href = 'https://multikick.com/';
      return;
    }
    // Build path. MultiKick caps at ~6 simultaneous streams; truncate
    // so the URL doesn't get absurdly long.
    const slugs = live.slice(0, 6).map(s => s.slug || s.username).filter(Boolean);
    btn.href = 'https://multikick.com/' + slugs.join('/');
    btn.classList.add('visible');
    btn.setAttribute('aria-hidden', 'false');
  }

  // Re-render the grid given a list of (currently known) live streamers.
  // Extracted so we can call it incrementally as fetch results arrive.
  function applyLiveResults(live, options = {}) {
    live = live.slice().sort((a, b) => (b.viewers || 0) - (a.viewers || 0));
    const totalViewers = live.reduce((sum, s) => sum + (s.viewers || 0), 0);
    updateSummary(live.length, totalViewers);
    updateMultiKickButton(live);

    if (live.length === 0) {
      // Only show the "none live" state if this is a final result
      // (otherwise an in-progress poll would keep flicking the grid
      // empty as the first few non-live results come back).
      if (options.final) {
        livePages = [];
        currentPageIdx = 0;
        if (rotateTimer) clearInterval(rotateTimer);
        renderNoneLive();
        rotationProgress.style.width = '0%';
      }
      return;
    }

    // v0.2.8 — show TOP 6 only, no rotation. Previously the code paged
    // any live count >6 into multiple pages and rotated through them
    // every 45s. That meant a lonely "page 2 with 1 tile" half the
    // time when 7 were live, and even with v0.2.7's balanced split
    // ([4, 3] etc.) the BRB scene still flipped its grid layout every
    // 45 seconds, which is a lot of visual change for a "be right
    // back" overlay.
    // Top 6 by viewers is the "highlights" view that actually fits a
    // BRB scene. Streamers 7+ don't appear, but at any given moment
    // they only had ~50% screen time before either, and the lower
    // viewer counts mean fewer people miss them.
    const pages = live.length ? [live.slice(0, 6)] : [];

    // v0.13.14 — distinguish "set unchanged" from "set changed" polls.
    // Watching the OBS scene during a commercial break shouldn't show
    // any visible change every poll — but the old code reset the
    // rotation progress bar to 0% and re-armed the rotate timer every
    // 90 seconds even when the live streamers were identical. That
    // counted-down progress bar visibly flickered, and a streamer 30s
    // into their 45s rotation window suddenly had a fresh 45s.
    //
    // SILENT path (same set, possibly different viewer counts):
    //   renderPage() DOM-diffs viewer count badges in place. Rotation
    //   timer + progress bar are left alone — the OBS viewer sees no
    //   visible change.
    // FULL path (set changed — someone went live or offline):
    //   Reset to page 0, restart rotation. The visible change is
    //   meaningful here (new content actually arrived).
    const sameAsBefore = JSON.stringify(pages.map(p => p.map(x => x.slug))) ===
                         JSON.stringify(livePages.map(p => p.map(x => x.slug)));
    livePages = pages;
    if (sameAsBefore) {
      // Silent update — just refresh in-tile data (viewer counts, etc.)
      renderPage(currentPageIdx);
      return;
    }
    currentPageIdx = 0;
    startRotation();
  }

  // Build a "fallback bench" of rostered streamers shown when we have
  // nothing else: no live streamers confirmed, no fresh cache. Embeds
  // the iframes anyway — Kick's player gracefully shows the channel's
  // OFFLINE landing card (avatar, recent VODs, follow CTA), which is
  // way better BRB content than a "WARMING UP" spinner.
  //
  // Picks the FIRST 4 ROSTER entries (by streamers.json order, which is
  // also the visual order on the homepage / promo page). Capped at 4
  // so it doesn't fill the whole grid with offline placeholders if
  // nobody's live yet.
  function renderFallbackBench() {
    const entries = (CONFIG.ROSTER || []).slice(0, 4);
    if (!entries.length) {
      renderNoneLive();
      return;
    }
    livePages = [];
    currentPageIdx = 0;
    if (rotateTimer) clearInterval(rotateTimer);
    rotationProgress.style.width = '0%';

    // Reuse the existing tile builder. Synthesize "stub" streamer
    // records with isLive: false; the iframe still loads and Kick's
    // player handles the offline state visually.
    const stubs = entries.map(e => ({
      slug: e.slug,
      name: e.name,
      isLive: false,
      viewers: 0,
      title: '',
      known: false,
    }));
    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.dataset.count = stubs.length;
    stubs.forEach((s, i) => grid.appendChild(buildTile(s, i === 0)));
    content.innerHTML = '';
    content.appendChild(grid);
    // Replace the "VIEWERS" badges (we don't have a count) with a
    // muted "OFFLINE" badge so users don't see "0 VIEWERS" forever.
    grid.querySelectorAll('.tile').forEach(t => {
      const vb = t.querySelector('.viewers-badge');
      if (vb) {
        vb.textContent = 'OFFLINE';
        vb.style.background = 'linear-gradient(135deg, #2a2530 0%, #1a1620 100%)';
        vb.style.color = 'var(--ink-dim)';
      }
      const lb = t.querySelector('.live-badge');
      if (lb) lb.style.display = 'none';
    });
    liveSummary.textContent = '— Connecting to streams —';
  }

  async function poll() {
    try {
      // v0.2.6 — Dropped the per-result incremental render. It was
      // added back when public CORS proxies could take 15+ seconds to
      // settle the whole roster — getting one tile up in 2s was a win
      // over waiting on the slowest proxy. With empire-worker serving
      // from KV, the entire poll completes in ~2s, so the incremental
      // render was actively flashing the grid:
      //   prev=[5 live tiles] → first incremental fires with just 1
      //   live discovered → grid drops to 1 tile → grows back to 5
      //   as the other 4 resolve. Visible as the BRB scene briefly
      //   losing 4 of 5 streamers every poll, then snapping back.
      // Now: wait for the whole poll, render once at the end. The
      // localStorage cache (LIVE_CACHE_KEY) still shows instant tiles
      // on initial page load, so cold-start UX is unaffected.
      const results = await fetchAllLive();
      const live = results.filter(r => r && r.isLive);

      // v0.2.1 — PROXY OUTAGE DETECTION. Count results where ALL
      // proxies failed (known: false). If essentially every fetch
      // failed, the "no one is live" verdict is unreliable — don't
      // wipe the screen to "WARMING UP" on bad data. Instead keep
      // whatever's currently on screen (cache or stale tiles) and
      // log so we can diagnose from the console.
      const knownFails = results.filter(r => r && !r.known).length;
      const total = results.length;
      const knownFailRatio = total > 0 ? knownFails / total : 0;
      console.log('[BRB] poll done',
        'live=' + live.length,
        'known=' + (total - knownFails) + '/' + total,
        'failed=' + knownFails);
      if (live.length === 0 && knownFailRatio > 0.5) {
        console.warn('[BRB] >50% of fetches failed (proxy outage?). '
          + 'Keeping current display, NOT wiping to "warming up".');
        // Don't call applyLiveResults with final:true — preserves
        // whatever tiles or cache are currently shown.
        return;
      }

      applyLiveResults(live, { final: true });

      // v0.2.1 — if we have nothing live AND nothing cached AND we DID
      // get reliable poll results (not a proxy outage), show the
      // fallback bench so the BRB scene has SOMETHING on screen.
      if (live.length === 0) {
        renderFallbackBench();
      }

      // Save successful poll to cache so next page-load is instant
      saveLiveCache(results);
    } catch (err) {
      console.warn('[BRB] poll failed:', err);
      // Keep showing whatever we had last time; don't crash the UI.
    }
  }

  // Load roster from /streamers.json (single source of truth), then start polling.
  // If the fetch fails, the grid stays empty and we log to console rather than crash.
  fetch('/streamers.json', { cache: 'no-cache' })
    .then(r => r.json())
    .then(data => {
      const list = Array.isArray(data) ? data : (data.streamers || []);
      // v0.2.1 — store {slug, name} objects so the URL slug (lowercase,
      // no spaces) is used for kick.com API + iframe URLs, while the
      // display name (with capitals/spaces) is shown on the tile card.
      // Pre-fix: streamers like "Ice Poseidon" 404'd on every poll
      // because we used the display name as the URL slug.
      CONFIG.ROSTER = list.map(s => ({
        slug: (s.slug || s.name || '').trim(),
        name: (s.name || s.slug || '').trim(),
      })).filter(e => e.slug);
      console.log('[BRB] roster loaded:', CONFIG.ROSTER.length, 'streamers');
      // INSTANT FIRST PAINT: if we have a recent cache (< 30 min old),
      // render those streamers right away so the page isn't blank
      // while the first poll is in flight. Fresh data overwrites this
      // as soon as it arrives.
      const cached = loadLiveCache();
      if (cached && cached.length > 0) {
        console.log('[BRB] cache hit:', cached.length, 'cached live streamers');
        applyLiveResults(cached);
      } else {
        console.log('[BRB] no usable cache, falling back to bench while first poll runs');
        renderFallbackBench();
      }
      poll();
      setInterval(poll, CONFIG.POLL_MS);
    })
    .catch(err => {
      console.error('[BRB] Failed to load /streamers.json:', err);
    });
</script>

</body>
</html>
