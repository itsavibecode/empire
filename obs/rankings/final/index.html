<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Empire X event rankings — FINAL REVEAL overlay.
     Fullscreen OBS browser source for the closing scene. Reads the
     same rankings.json + streamers.json + empire-worker /live the
     ticker uses, then plays a dramatic 10 → 1 reveal animation
     when the scene becomes active.
     Suggested OBS size: 1920 × 1080.
     Auto-plays on mount; switch away + back to re-trigger
     (assuming "Refresh browser when scene becomes active" is on). -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="version" content="0.1.5">
<title>Empire X — Final Rankings</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Oswald:wght@300;400;500;600;700&family=Bebas+Neue&family=DM+Sans:wght@500;600;700&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Oswald:wght@300;400;500;600;700&family=Bebas+Neue&family=DM+Sans:wght@500;600;700&display=swap"></noscript>
<style>
  :root {
    --gold:       #D4A843;
    --gold-light: #F0D68A;
    --gold-dark:  #8B6620;
    --silver:     #B7B7B7;
    --bronze:     #B97B4D;
    --cream:      #F5F1EB;
    --cream-dim:  rgba(245,241,235,0.75);
    --ink:        #0A0A0A;
    --hairline:   rgba(245,241,235,0.12);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    color: var(--cream);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow: hidden;
  }

  /* === STAGE ===
     Dark glass full-bleed background so the reveal feels like a
     dedicated scene, not a corner overlay. Streamers can still
     composite live video underneath if they want a subtle reveal,
     since the background carries 88% alpha. */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    padding: 4vh 4vw;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(ellipse 60% 50% at 50% 30%, rgba(212,168,67,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 80%, rgba(212,168,67,0.08) 0%, transparent 70%),
      linear-gradient(180deg, rgba(10,10,10,0.88) 0%, rgba(15,12,8,0.92) 100%);
  }

  /* === HEADER === */
  .header {
    text-align: center;
    margin-bottom: 1.5vh;
    opacity: 0;
    animation: headerIn 1.2s ease 0.2s forwards;
  }
  @keyframes headerIn {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .header-eyebrow {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.55em;
    color: var(--gold);
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
  }
  .header-title {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: clamp(2.4rem, 5vw, 4rem);
    margin: 0.4rem 0 0;
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 4px 18px rgba(0,0,0,0.7);
    letter-spacing: -0.005em;
  }

  /* === LIST ===
     v0.1.4 — rows now scroll up from below into their final
     positions instead of stacking statically. The whole list starts
     way below the visible area (translateY ~60vh) and the LIST
     itself animates upward to its rest position over ~14 seconds.
     Each individual row STILL gets a staggered fade-in + scale
     animation tied to its rank (computed at runtime via
     --reveal-delay) so the dramatic countdown order stays intact —
     #10 reveals first as it scrolls into view from below, #1 last
     when the list comes to rest. Slimmer row sizing (-rank/-avatar
     down to 64px) so all 10 fit on a 1080p OBS canvas with room
     for the header and footer. */
  .list {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 0.75vh;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
    /* Whole list slides up over the reveal phase. */
    transform: translateY(60vh);
    animation: listScrollUp 14s cubic-bezier(0.32, 0.04, 0.34, 1) 0.8s forwards;
  }
  @keyframes listScrollUp {
    to { transform: translateY(0); }
  }

  .row {
    display: grid;
    grid-template-columns: 72px 64px 1fr auto;
    gap: 1.1rem;
    align-items: center;
    padding: 0.55vh 1.1rem;
    background: rgba(20,20,20,0.55);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    opacity: 0;
    animation: rowReveal 0.9s cubic-bezier(0.18, 0.85, 0.25, 1) forwards;
    animation-delay: var(--reveal-delay, 0s);
  }
  @keyframes rowReveal {
    0%   { opacity: 0; transform: scale(0.94); }
    60%  { opacity: 1; transform: scale(1.02); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* Default style (ranks 4-10): gold ring, transparent inside,
     number drawn in the same gold as the ring. #1/#2/#3 override
     this with solid gradient fills below. */
  .row-rank {
    width: 60px; height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 1.7rem;
    color: var(--gold);
    background: transparent;
    border: 2.5px solid var(--gold);
    box-shadow: 0 3px 10px rgba(0,0,0,0.5);
  }

  .row-avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--hairline);
    background: linear-gradient(135deg, #2a2018, #1a1208);
    box-shadow: 0 3px 10px rgba(0,0,0,0.5);
  }
  .row-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .row-name {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 1.45rem;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    letter-spacing: -0.005em;
  }
  .row-meta {
    font-family: 'Oswald', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--cream-dim);
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }

  /* Top-3 styling: solid gradient fills (override the gold-ring
     default), slightly bigger rank disc + glow. Each one re-sets
     background, border, AND color so the ring style doesn't leak
     through. */
  .row-rank.rank-1 {
    width: 76px; height: 76px;
    font-size: 2.15rem;
    background: linear-gradient(135deg, #FFD86A 0%, #D4A843 50%, #8B6620 100%);
    border: 2px solid rgba(255,255,255,0.5);
    color: #1a0e02;
    text-shadow: 0 1px 0 rgba(255,255,255,0.22);
    box-shadow: 0 3px 12px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,216,106,0.6), 0 0 24px rgba(255,216,106,0.6);
    animation: leaderShine 2.2s ease-in-out infinite;
  }
  @keyframes leaderShine {
    0%, 100% { box-shadow: 0 3px 12px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,216,106,0.6), 0 0 24px rgba(255,216,106,0.6); }
    50%      { box-shadow: 0 3px 12px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,216,106,0.9), 0 0 38px rgba(255,216,106,0.95); }
  }
  .row-rank.rank-2 {
    background: linear-gradient(135deg, #EEEEEE 0%, #B7B7B7 50%, #7A7A7A 100%);
    border: 2px solid rgba(255,255,255,0.5);
    color: #1a1a1a;
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
    box-shadow: 0 3px 12px rgba(0,0,0,0.5), 0 0 0 2px rgba(183,183,183,0.5), 0 0 18px rgba(183,183,183,0.4);
  }
  .row-rank.rank-3 {
    background: linear-gradient(135deg, #E1A47F 0%, #B97B4D 50%, #7C4A22 100%);
    border: 2px solid rgba(255,255,255,0.5);
    color: #1a0e02;
    text-shadow: 0 1px 0 rgba(255,255,255,0.22);
    box-shadow: 0 3px 12px rgba(0,0,0,0.5), 0 0 0 2px rgba(185,123,77,0.5), 0 0 18px rgba(185,123,77,0.4);
  }
  /* #1 row keeps a slightly larger frame to land the moment, but
     trimmed enough that 10 rows still fit. */
  .row.is-leader {
    padding: 0.9vh 1.1rem;
    background: linear-gradient(90deg, rgba(212,168,67,0.18) 0%, rgba(212,168,67,0.05) 100%);
    border-color: rgba(212,168,67,0.45);
    box-shadow: 0 6px 22px rgba(0,0,0,0.55), 0 0 22px rgba(212,168,67,0.25);
  }
  .row.is-leader .row-name { font-size: 1.7rem; }
  .row.is-leader .row-avatar { width: 76px; height: 76px; }
  .row.is-leader { grid-template-columns: 88px 76px 1fr auto; }

  /* === EMPTY STATE === */
  .empty {
    margin: auto;
    font-family: 'Oswald', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--cream-dim);
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
  }

  /* === FOOTER (Empire X mark) === */
  .stage-foot {
    text-align: center;
    margin-top: 1.5vh;
    opacity: 0;
    animation: footIn 1s ease 1s forwards;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.5em;
    color: var(--gold);
    text-shadow: 0 2px 4px rgba(0,0,0,0.7);
  }
  @keyframes footIn { to { opacity: 1; } }
</style>
</head>
<body>

<div class="stage">
  <div class="header">
    <div class="header-eyebrow">EMPIRE X &middot; EVENT STANDINGS</div>
    <h1 class="header-title">FINAL RANKINGS</h1>
  </div>
  <div class="list" id="list">
    <div class="empty">Rankings load here once the standings are set</div>
  </div>
  <div class="stage-foot">OUREMPIREX.COM</div>
</div>

<script>
/* =====================================================================
   Final-reveal overlay — sources the SAME data as /obs/rankings/:
     rankings.json (curated standings), streamers.json (names),
     empire-worker /live (real Kick avatars).

   Animation: reveals from #10 → #1 with a 1.2s gap between each
   row landing. #1 gets ~2s of dwell time before the streamer cuts
   the scene. Each row's stagger is set via --reveal-delay inline
   style so the CSS keyframe handles the motion and JS just picks
   the timing.
===================================================================== */
(function () {
  var WORKER_LIVE = 'https://empire-worker.sevendwarfs.workers.dev/live';
  var TOP_N = 10;
  // v0.1.4 — timings now align with the 14s list scroll-up animation
  // (defined in CSS). Each row's reveal triggers roughly when its
  // position scrolls into the visible area, so the dramatic countdown
  // happens AS the list rises into view rather than after.
  var BASE_DELAY_S = 1.6;   // when #10 (bottom of list) crosses into view
  var STEP_S = 1.25;        // gap between successive row reveals
  var FINALE_PAUSE_S = 1.0; // extra dwell before #1 lands at the top

  var listEl = document.getElementById('list');

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function render(ranked) {
    if (!ranked.length) {
      listEl.innerHTML = '<div class="empty">Rankings load here once the standings are set</div>';
      return;
    }

    // Build rows DOM in rank order. Animation delay increases for
    // EARLIER reveals — #N (highest in the list) reveals first.
    // Compute delays such that the last entry (#1) is the finale.
    // Delay formula: BASE + (TOP_N - rank) * STEP, with an extra
    // FINALE_PAUSE between #2 and #1.
    var fragment = document.createDocumentFragment();
    ranked.forEach(function (s) {
      var row = document.createElement('div');
      var isLeader = (s.rank === 1);
      row.className = 'row' + (isLeader ? ' is-leader' : '');

      // For a 10→1 reveal, lowest-rank-in-list (worst) appears
      // first. So delay = (s.rank - 1) * STEP, offset by BASE.
      // #1 lands last, with finale pause.
      var delay;
      if (isLeader) {
        delay = BASE_DELAY_S + (ranked.length - 1) * STEP_S + FINALE_PAUSE_S;
      } else {
        delay = BASE_DELAY_S + (ranked.length - s.rank) * STEP_S;
      }
      row.style.setProperty('--reveal-delay', delay + 's');

      var img = s.avatar
        ? '<img src="' + s.avatar + '" alt="" loading="lazy" referrerpolicy="no-referrer">'
        : '';
      var rankCls = s.rank >= 1 && s.rank <= 3 ? ' rank-' + s.rank : '';

      row.innerHTML =
        '<div class="row-rank' + rankCls + '">' + s.rank + '</div>' +
        '<div class="row-avatar">' + img + '</div>' +
        '<div class="row-name">' + escapeHtml(s.name || s.slug) + '</div>' +
        '<div class="row-meta">@' + escapeHtml(s.slug) + '</div>';
      fragment.appendChild(row);
    });

    listEl.innerHTML = '';
    listEl.appendChild(fragment);
  }

  // Demo mode (?demo=1): inject ranks onto the live roster so the
  // single-source-of-truth pipeline still produces a populated list.
  var DEMO_RANK_BY_SLUG = {
    shangel: 1, cobbruvs: 2, mikesmallsjr: 3, markynextdoor: 4,
    iceposeidon: 5, nicklee: 6, dtanmanb: 7, kennyhoopz: 8,
    xenathewitch: 9, briewylde: 10,
  };
  var isDemo = new URLSearchParams(location.search).get('demo') === '1';

  Promise.all([
    fetch('/streamers.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }),
    fetch(WORKER_LIVE, { cache: 'no-cache' }).then(function (r) { return r.json(); }).catch(function () { return null; }),
  ]).then(function (results) {
    var roster = (results[0] && results[0].streamers) || [];
    var snap = results[1];
    var chans = (snap && snap.channels) || {};

    // Demo mode stamps ranks onto the roster directly so the merge
    // logic below uses the same single source of truth.
    if (isDemo) {
      roster.forEach(function (s) {
        if (s && s.slug && DEMO_RANK_BY_SLUG[s.slug.toLowerCase()]) {
          s.rank = DEMO_RANK_BY_SLUG[s.slug.toLowerCase()];
        }
      });
    }

    var streamerBySlug = {};
    roster.forEach(function (s) {
      if (s && s.slug) streamerBySlug[s.slug.toLowerCase()] = s;
    });
    var avatarBySlug = {};
    Object.keys(chans).forEach(function (k) {
      if (chans[k] && chans[k].profile_pic) avatarBySlug[k] = chans[k].profile_pic;
    });

    // v0.1.3 — single source of truth: per-streamer `rank` field
    // on each entry in streamers.json (set via the "Poll Ranking"
    // field in Featured Kick Streamers).
    var rankBySlug = {};
    roster.forEach(function (s) {
      var n = parseInt(s && s.rank, 10);
      if (Number.isFinite(n) && n >= 1 && s.slug) {
        rankBySlug[s.slug.toLowerCase()] = n;
      }
    });

    var ranked = Object.keys(rankBySlug)
      .map(function (slug) {
        var s = streamerBySlug[slug];
        return {
          slug: slug,
          name: (s && s.name) || slug,
          rank: rankBySlug[slug],
          avatar: avatarBySlug[slug] || '',
        };
      })
      .sort(function (a, b) { return a.rank - b.rank; })
      .slice(0, TOP_N);

    render(ranked);
  }).catch(function (err) {
    console.warn('[final-rankings] fetch failed:', err);
  });
})();
</script>
</body>
</html>
