<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Internal operator shortcut. Don't index. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="version" content="0.1.0">
<title>Empire X &mdash; MultiKick</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0A0A0A;
    color: #F5F1EB;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .wrap {
    padding: 2rem 1.5rem;
    max-width: 480px;
  }
  .logo {
    width: 72px;
    height: 72px;
    margin-bottom: 1.2rem;
    opacity: 0.95;
  }
  .title {
    font-size: 1.6rem;
    letter-spacing: -0.01em;
    color: #D4A843;
    margin: 0 0 0.4rem;
    font-weight: 800;
  }
  .body {
    font-size: 0.95rem;
    color: rgba(245,241,235,0.7);
    line-height: 1.5;
    margin: 0 0 1.4rem;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid rgba(212,168,67,0.25);
    border-top-color: #D4A843;
    border-radius: 50%;
    margin: 0 auto 1rem;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fallback {
    margin-top: 1rem;
    font-size: 0.85rem;
    color: rgba(245,241,235,0.55);
  }
  .fallback a {
    color: #D4A843;
    text-decoration: none;
    border-bottom: 1px dotted rgba(212,168,67,0.5);
  }
  .fallback a:hover { color: #F0D68A; border-bottom-color: #F0D68A; }
  .target {
    margin-top: 0.8rem;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    color: rgba(245,241,235,0.45);
    word-break: break-all;
    line-height: 1.4;
  }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="/logo.png" alt="Empire X">
  <div class="spinner" id="spinner"></div>
  <h1 class="title">Loading MultiKick</h1>
  <p class="body" id="status">Checking which Empire X streamers are live&hellip;</p>
  <div class="fallback">
    Not redirecting?
    <a id="fallbackLink" href="https://multikick.com/" target="_blank" rel="noopener">Open MultiKick</a>
  </div>
  <div class="target" id="targetUrl"></div>
</div>

<script>
/* ====================================================================
   /multi/ — operator shortcut that mirrors the "Failing? Load
   MultiKick" button on /obs/. It loads the current streamer list from
   /streamers.json, runs the same Kick API live-check the OBS page uses
   (via CORS proxies racing in parallel), and redirects to
   https://multikick.com/<slug>/<slug>/... with the currently-live
   slugs in the path.

   Why a live-check at all? MultiKick's grid only makes sense when at
   least some channels are actually live. If we redirected to a path
   built from the whole configured roster, MultiKick would show a wall
   of "offline" tiles. Same behavior as the OBS button.

   Caps at 6 slugs (same as the OBS button — MultiKick gets
   uncomfortable past that).

   Bypass: /multi/?all redirects with EVERY configured slug regardless
   of live state. /multi/?bare sends straight to https://multikick.com/.
==================================================================== */
(function () {
  const STATUS = document.getElementById('status');
  const TARGET = document.getElementById('targetUrl');
  const SPINNER = document.getElementById('spinner');
  const FALLBACK = document.getElementById('fallbackLink');
  const params = new URLSearchParams(location.search);
  // 9 fits MultiKick's 3x3 grid cleanly. /obs/'s "Failing? Load
  // MultiKick" button has its own cap (6) baked into obs/index.html
  // and is unaffected by this — they're independent code paths.
  const MAX_SLUGS = 9;

  function showTarget(href) {
    TARGET.textContent = href;
    FALLBACK.href = href;
  }
  function done(href, label) {
    SPINNER.style.display = 'none';
    STATUS.textContent = label || 'Redirecting to MultiKick…';
    showTarget(href);
    // Use replace() so the back button skips this loading page.
    location.replace(href);
  }
  function bare(reason) {
    done('https://multikick.com/', reason || 'No streamers live. Sending you to MultiKick.');
  }
  // Fallback used when the live-check finds 0 confirmed-live channels.
  // Could be that nobody's live right now, OR that the public CORS
  // proxies all rate-limited. Either way the operator gets more value
  // landing on a MultiKick page populated with Empire X channels than
  // on the bare homepage — at worst they see a wall of offline tiles
  // for channels that aren't streaming yet. Send the first MAX_SLUGS
  // configured slugs so the URL still fits in a clean 3x3 grid.
  function rosterFallback(slugs, reason) {
    const subset = slugs.slice(0, MAX_SLUGS);
    if (subset.length === 0) return bare(reason);
    done('https://multikick.com/' + subset.join('/'), reason);
  }

  // ?bare — straight to multikick.com with no slugs.
  if (params.has('bare')) {
    bare('Opening MultiKick…');
    return;
  }

  fetch('/streamers.json', { cache: 'no-cache' })
    .then(r => r.json())
    .then(async (data) => {
      const all = (data.streamers || [])
        .map(s => (s.slug || '').trim().toLowerCase())
        .filter(Boolean);

      if (all.length === 0) {
        bare('No streamers configured. Sending you to MultiKick.');
        return;
      }

      // ?all — skip the live check and use EVERY configured Kick slug.
      // No MAX_SLUGS cap here (that cap only applies to the default
      // live-filtered mode to match the OBS button's behavior).
      // ?all is an explicit "give me the whole roster" override; if
      // MultiKick chokes on too many channels at once the user can fall
      // back to the default /multi/ which auto-trims to live + top 6.
      if (params.has('all')) {
        const href = 'https://multikick.com/' + all.join('/');
        done(href, `Opening all ${all.length} configured Kick channels on MultiKick…`);
        return;
      }

      STATUS.textContent = `Checking ${all.length} streamers…`;

      // Same proxy stack as /obs/. Race all three and take the first
      // one to return a valid Kick channel response. Per-channel
      // timeout 6s — anything slower is almost certainly dead.
      const PROXIES = [
        s => ({ url: `https://api.allorigins.win/raw?url=${encodeURIComponent('https://kick.com/api/v2/channels/' + s)}`, wrapped: false }),
        s => ({ url: `https://corsproxy.io/?url=${encodeURIComponent('https://kick.com/api/v2/channels/' + s)}`,        wrapped: false }),
        s => ({ url: `https://api.allorigins.win/get?url=${encodeURIComponent('https://kick.com/api/v2/channels/' + s)}`, wrapped: true  }),
      ];
      async function tryProxy(build, slug) {
        const { url, wrapped } = build(slug);
        const res = await fetch(url, { signal: AbortSignal.timeout(6000) });
        if (!res.ok) throw new Error('http ' + res.status);
        const text = await res.text();
        if (!text) throw new Error('empty');
        const d = wrapped ? JSON.parse(JSON.parse(text).contents || '{}') : JSON.parse(text);
        if (d.id == null && d.slug == null && d.user_id == null) throw new Error('not a kick channel');
        const ls = d.livestream;
        const isLive = !!ls && (ls.is_live === true || ls.viewer_count != null);
        return { slug, isLive, viewers: isLive ? Number(ls.viewer_count || 0) : 0 };
      }
      async function checkSlug(slug) {
        try {
          return await Promise.any(PROXIES.map(p => tryProxy(p, slug)));
        } catch (_e) {
          return { slug, isLive: false, viewers: 0 };
        }
      }

      // Throttled concurrency. Firing 34 channels × 3 proxies = 102
      // simultaneous CORS-proxy requests gets the public proxies rate-
      // limited fast (observed: ~75% of channels timed out under full
      // parallel load). Limit to 6 channels in flight at a time — still
      // races all 3 proxies per channel, just paces the overall throughput.
      const CONCURRENCY = 6;
      const results = new Array(all.length);
      let cursor = 0;
      async function worker() {
        while (true) {
          const i = cursor++;
          if (i >= all.length) return;
          results[i] = await checkSlug(all[i]);
        }
      }
      await Promise.all(Array.from({length: CONCURRENCY}, worker));

      const live = results
        .filter(r => r && r.isLive)
        .sort((a, b) => (b.viewers || 0) - (a.viewers || 0))
        .slice(0, MAX_SLUGS)
        .map(r => r.slug);

      if (live.length === 0) {
        // No confirmed-live hits. Could be everyone's offline, could
        // be proxies failed — either way, send a populated MultiKick
        // URL with the first MAX_SLUGS configured channels instead of
        // dumping the operator on a bare homepage.
        rosterFallback(all, 'No live channels confirmed. Opening MultiKick with the Empire X roster…');
        return;
      }

      const href = 'https://multikick.com/' + live.join('/');
      done(href, `Opening ${live.length} live channel${live.length === 1 ? '' : 's'} on MultiKick…`);
    })
    .catch(err => {
      console.warn('[multi] roster fetch failed:', err);
      bare('Couldn’t load the streamer list. Sending you to MultiKick.');
    });

  // Hard safety net — if the live check is somehow still running after
  // 14 seconds, fall back to the roster URL (not bare multikick) so
  // the operator still lands on something usable. 14s gives the
  // throttled worker pool time to finish 34 channels at ~2s each.
  setTimeout(async () => {
    if (!document.hidden && STATUS.textContent.includes('Checking')) {
      // Re-fetch the roster cheaply (already cached) and use it.
      try {
        const data = await (await fetch('/streamers.json', { cache: 'force-cache' })).json();
        const slugs = (data.streamers || []).map(s => (s.slug || '').trim().toLowerCase()).filter(Boolean);
        rosterFallback(slugs, 'Live check timed out. Opening MultiKick with the Empire X roster…');
      } catch (_e) {
        bare('Live check timed out. Sending you to MultiKick.');
      }
    }
  }, 14000);
})();
</script>
</body>
</html>
