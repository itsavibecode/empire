<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Light-theme variant of /analytics/. Preview-only for theme A/B
     comparison. Same iframe + privacy posture as the dark version;
     only the chrome colors and typography weights differ. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="version" content="0.1.0-light">
<title>Empire X — Site Analytics</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Oswald:wght@300;400;500;600;700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:        #B58831;  /* slightly darker gold so it reads on white */
    --gold-light:  #D4A843;
    --gold-dark:   #8B6620;
    --paper:       #FFFFFF;
    --ink:         #1A1A1A;
    --ink-soft:    #444444;
    --ink-muted:   #757575;
    --hairline:    rgba(26,26,26,0.10);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
  }

  /* === HEADER ===
     Same Empire X chrome — gold eyebrow + Playfair gold-gradient title
     + Oswald subtitle — but on white with darker ink for body text. */
  header {
    padding: 1.6rem 1.5rem 1.2rem;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(212,168,67,0.08) 0%, transparent 70%),
      var(--paper);
    border-bottom: 1px solid var(--hairline);
    text-align: center;
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
    flex-wrap: wrap;
  }
  .header-logo {
    width: 56px;
    height: 56px;
    object-fit: contain;
    flex: 0 0 auto;
  }
  .header-text {
    text-align: left;
    line-height: 1.1;
  }
  .header-eyebrow {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.45em;
    color: var(--gold);
    margin-bottom: 0.25rem;
  }
  .header-title {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: clamp(1.6rem, 3vw, 2.4rem);
    letter-spacing: -0.01em;
    /* On white, a gold gradient on the headline retains the brand cue
       without becoming an eye-watering yellow blast. */
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 0;
  }
  .header-subtitle {
    font-family: 'Oswald', sans-serif;
    font-weight: 400;
    font-size: 0.85rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-top: 0.3rem;
  }

  /* === IFRAME WRAPPER === */
  main {
    flex: 1 0 auto;
    padding: 1.5rem;
    display: flex;
    justify-content: center;
  }
  .frame-wrap {
    width: 100%;
    max-width: 1400px;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 0 14px 40px rgba(0,0,0,0.06);
  }
  .frame-wrap iframe {
    display: block;
    width: 100%;
    height: 1600px;            /* matches the dark version — no inner scroll */
    border: 0;
  }

  /* === FOOTER === */
  footer {
    padding: 1.6rem 1.5rem 2rem;
    text-align: center;
    border-top: 1px solid var(--hairline);
  }
  .footer-line {
    font-family: 'Oswald', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .footer-line a {
    color: var(--ink-soft);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .footer-line a:hover { color: var(--gold); }
  .footer-version {
    margin-top: 0.6rem;
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    color: rgba(26,26,26,0.30);
  }

  /* === MOBILE TWEAKS === */
  @media (max-width: 600px) {
    header { padding: 1.2rem 1rem 0.9rem; }
    .header-inner { gap: 0.8rem; }
    .header-logo { width: 44px; height: 44px; }
    .header-text { text-align: center; }
    main { padding: 0.8rem; }
    .frame-wrap iframe { height: 1600px; }
    footer { padding: 1.2rem 1rem 1.6rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <img class="header-logo" src="/logo.png" alt="Empire X" loading="eager">
    <div class="header-text">
      <div class="header-eyebrow">Empire X</div>
      <h1 class="header-title">Site Analytics</h1>
      <div class="header-subtitle">Live data from ourempirex.com</div>
    </div>
  </div>
</header>

<main>
  <div class="frame-wrap">
    <iframe
      src="https://datastudio.google.com/embed/reporting/92547b50-c208-4893-b91f-f0fd1ac2bdeb/page/MXYxF"
      title="Empire X site analytics dashboard"
      frameborder="0"
      allowfullscreen
      sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
      loading="eager"
      referrerpolicy="no-referrer"></iframe>
  </div>
</main>

<footer>
  <div class="footer-line">
    &copy; 2026 Our Empire &bull; Empire X &bull;
    <a href="https://ourempirex.com">ourempirex.com</a>
  </div>
  <div class="footer-version">Analytics v0.1.0 (light)</div>
</footer>

</body>
</html>
