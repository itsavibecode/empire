  - name: display
    label: Display Settings
    description: |
      Site-wide display toggles. Right now there's just one switch:
      whether the Confirmed Streamers avatars render in black-and-white
      (with a colored hover) or in full color all the time. Applies to
      ALL streamer avatars at once — there is no per-streamer override.

      Saving here triggers the GitHub Action that updates the relevant
      attribute in index.html (~30 seconds after save).
    files:
      - file: display.json
        label: Display settings
        name: display_file
        format: json
        fields:
          - name: streamer_avatars_grayscale
            label: 'Streamer avatars in black-and-white'
            widget: boolean
            default: false
            hint: 'When ON: streamer avatars are black-and-white by default and turn colored when you hover (the original design). When OFF: avatars are full color all the time. Affects all streamers.'

  - name: featured_group
    label: Featured Group Section
    description: |
      The "Featured Group" section that highlights one streaming group
      (currently Sky9). Shows a small label pill, the group name as a
      big title, an optional tagline ("🏆 Hall of Fame Group"), a
      description, a list of detail rows (each with an emoji icon +
      heading + body), and the group's house photo.

      Drag detail rows to reorder. Add or remove rows as needed.
      Saving here triggers the GitHub Action that regenerates the
      section in index.html (~30 seconds after save).
    files:
      - file: featured-group.json
        label: Featured Group content
        name: featured_group_file
        format: json
        fields:
          - name: label
            label: 'Section label (small uppercase pill above the name)'
            widget: string
            default: 'Featured Group'
            hint: 'e.g. "Featured Group"'
          - name: name
            label: 'Group name (the big title)'
            widget: string
            hint: 'Shown as the section''s big bold title. e.g. "Sky9".'
          - name: tagline
            label: 'Tagline (optional gold pill above the description)'
            widget: string
            required: false
            hint: 'Optional small badge — leave blank to hide. Emoji allowed (e.g. "🏆 Hall of Fame Group").'
          - name: description
            label: 'Description paragraph'
            widget: text
            hint: 'The body text describing the group. Plain text — no HTML.'
          - name: details
            label: 'Detail rows'
            label_singular: 'Detail row'
            widget: list
            collapsed: false
            summary: '{{fields.icon}} {{fields.heading}} — {{fields.body}}'
            hint: 'Each row is an icon + heading + body. Drag to reorder. Add or remove rows as needed.'
            fields:
              - name: icon
                label: 'Icon (single emoji)'
                widget: string
                hint: 'A single emoji shown to the left of the row (e.g. "📅", "🏠", "🎤"). Use one emoji only.'
              - name: heading
                label: 'Heading'
                widget: string
                hint: 'Short label, e.g. "Wristband Admission", "Property".'
              - name: body
                label: 'Body'
                widget: text
                hint: 'The text shown beneath the heading.'
          - name: house_image
            label: 'House photo'
            widget: image
            choose_url: false
            media_folder: '/'
            public_folder: '/'
            hint: 'The group''s house / venue photo shown next to the details. Saved at the repo root.'
          - name: house_image_alt
            label: 'Photo alt text (for accessibility)'
            widget: string
            default: 'Featured group house'
            hint: 'Description of the photo for screen readers. e.g. "Sky9 Group House".'

  - name: sponsor
    label: Sponsor Block
    description: |
      One sponsor link displayed on the homepage. The logo + label
      sits either in the top-left of the page (always visible while
      scrolling) or inside the footer (only visible at the bottom of
      the page).

      Saving here triggers the GitHub Action that regenerates the
      sponsor block in index.html (~30 seconds after save).
    files:
      - file: sponsor.json
        label: Sponsor content
        name: sponsor_file
        format: json
        fields:
          - name: enabled
            label: 'Show the sponsor block on the homepage'
            widget: boolean
            default: true
            hint: 'When OFF, no sponsor renders anywhere on the homepage. Use this if a sponsorship ends without losing the saved details.'
          - name: placements
            label: 'Where the sponsor appears (check one or both)'
            widget: select
            multiple: true
            min: 1
            default: ['top-left']
            options:
              - { label: 'Top-left corner (always visible while scrolling)', value: 'top-left' }
              - { label: 'Bottom of the page footer (only seen when scrolled to bottom)', value: 'footer' }
            hint: 'Check either spot, or both. Top-left = maximum visibility, floats over the hero. Footer = subtle, only seen by visitors who scroll to the end. Both checked = sponsor shows in both locations on the same page.'
          - name: logo_image
            label: 'Sponsor logo'
            widget: image
            choose_url: false
            media_folder: '/'
            public_folder: '/'
            hint: 'Square works best (e.g. 256×256). The site renders it at 64px (top-left) or 54px (footer), so the source can be larger. Saved at the repo root.'
          - name: link_url
            label: 'Where the logo links to when clicked'
            widget: string
            hint: 'Full https://... URL. Opens in a new tab.'
            pattern: ['^https?://.+', 'Must be a full http(s):// URL']
          - name: eyebrow_text
            label: 'Small label above the sponsor name'
            widget: string
            default: 'Sponsored by'
            hint: 'Shown in small gold uppercase above the sponsor name. Usually "Sponsored by" but you could use "Powered by" / "Presented by" / etc.'
          - name: name
            label: 'Sponsor name'
            widget: string
            hint: 'The bold name shown next to the logo (e.g. "Stream Auto Pilot").'
          - name: alt_text
            label: 'Logo alt text (for accessibility)'
            widget: string
            required: false
            hint: 'Description of the logo for screen readers. Defaults to the sponsor name if left blank.'
