<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Empire X live-voters ticker — separate OBS browser source from
     the poll widget. Shows the most recent N votes as they land:
     Kick avatar + username + their choice. Each new vote slides
     in at the top with a soft entry animation; the oldest row
     fades out at the bottom. Designed to sit alongside (or below)
     the poll widget overlay during active polls.

     Suggested OBS size: 480 wide × 480 tall. Body is transparent
     so it composites cleanly. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="version" content="0.1.1">
<title>Empire X Voting — Live Voters</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap"></noscript>
<style>
  :root {
    --gold:       #D4A843;
    --gold-light: #F0D68A;
    --cream:      #F5F1EB;
    --cream-dim:  rgba(245,241,235,0.7);
    --green:      #53FC18;
    --red:        #FF4D4D;
    --hairline:   rgba(245,241,235,0.12);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    color: var(--cream);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 1.2rem;
  }

  /* === WIDGET CARD === */
  .ticker {
    width: 100%;
    max-width: 460px;
    background: linear-gradient(180deg, rgba(10,10,10,0.92) 0%, rgba(15,12,8,0.88) 100%);
    border: 1px solid rgba(212,168,67,0.4);
    border-radius: 14px;
    padding: 0.9rem 1rem 0.85rem;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.55), 0 0 24px rgba(212,168,67,0.18);
  }

  /* === HEAD === */
  .ticker-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.7rem;
    margin-bottom: 0.7rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--hairline);
  }
  .brand {
    display: flex; align-items: center; gap: 0.5rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-shadow: 0 2px 4px rgba(0,0,0,0.7);
  }
  .brand img {
    width: 22px; height: 22px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
  }
  .brand span { color: var(--cream); margin-left: 0.4em; }
  .total {
    font-family: 'Oswald', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--cream-dim);
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
  }
  .total strong { color: var(--gold-light); font-weight: 600; }
  .live-dot {
    display: inline-block;
    width: 7px; height: 7px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--green);
    margin-right: 0.4em;
    vertical-align: middle;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* === LIST === */
  .voter-list {
    list-style: none;
    margin: 0;
    padding: 0;
    /* Limit height so the oldest entries scroll out cleanly. */
    max-height: 360px;
    overflow: hidden;
  }
  .voter-row {
    display: grid;
    grid-template-columns: 40px 1fr auto;
    gap: 0.7rem;
    align-items: center;
    padding: 0.45rem 0.1rem;
    border-bottom: 1px solid var(--hairline);
    /* Each row enters via slide-in from above. */
    animation: rowIn 0.42s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .voter-row:last-child { border-bottom: 0; }
  @keyframes rowIn {
    from { transform: translateY(-8px); opacity: 0; }
    to   { transform: translateY(0);     opacity: 1; }
  }
  /* When a row is leaving (fadeOut class added by JS) it eases out. */
  .voter-row.fadeOut {
    animation: rowOut 0.35s ease both;
  }
  @keyframes rowOut {
    to { transform: translateY(8px); opacity: 0; max-height: 0; padding: 0; border: 0; }
  }

  .voter-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2a2018, #1a1208);
    border: 1px solid var(--hairline);
    overflow: hidden;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .voter-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .voter-name {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .voter-name small {
    display: block;
    font-weight: 400;
    font-size: 0.7rem;
    color: var(--cream-dim);
    letter-spacing: 0.04em;
    margin-top: 1px;
  }
  .voter-choice {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 0.78rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="ticker" id="ticker">
  <div class="ticker-head">
    <div class="brand">
      <img src="/logo.png" alt="">
      EMPIRE X<span>LIVE VOTES</span>
    </div>
    <div class="total">
      <span class="live-dot"></span><strong id="totalVotes">746</strong> total
    </div>
  </div>
  <ul class="voter-list" id="voterList">
    <!-- JS renders rows. Initial fill happens on first tick(). -->
  </ul>
</div>

<script>
/* =====================================================================
   Live voters ticker — prototype v0.1.1.

   Now pulls REAL Kick avatars (and uses real Empire X streamer
   slugs as the mock voter pool) by hitting empire-worker's /live
   endpoint, which carries profile_pic per channel as of worker
   v0.3.4. Each voter row shows the streamer's actual Kick avatar.

   Why this matters even though the production flow is different:
   when a real viewer signs in with Kick OAuth to vote, the OAuth
   response carries their profile_pic — we capture it at vote time
   and store it alongside the vote. So in production this overlay
   reads avatar URLs straight off the Firestore vote document. The
   prototype just sources them from a different place; the render
   path is identical.
===================================================================== */
(function () {
  var WORKER_LIVE_URL = 'https://empire-worker.sevendwarfs.workers.dev/live';

  // Choice pool — used to randomly pick a vote choice per fake voter.
  var CHOICES = ['Sky9 House', 'DTB House', 'Mixtapes House', 'Kozy House'];

  var listEl  = document.getElementById('voterList');
  var totalEl = document.getElementById('totalVotes');
  var MAX_ROWS = 6;
  var total = 746;

  // Built once we fetch the snapshot. Each entry: { slug, avatar }.
  var POOL = [];

  function pickChoice() {
    return CHOICES[Math.floor(Math.random() * CHOICES.length)];
  }
  function pickVoter() {
    return POOL[Math.floor(Math.random() * POOL.length)];
  }

  function buildRow(voter, choice) {
    var row = document.createElement('li');
    row.className = 'voter-row';
    row.innerHTML =
      '<div class="voter-avatar">' +
        '<img src="' + voter.avatar + '" alt="" loading="lazy" referrerpolicy="no-referrer">' +
      '</div>' +
      '<div class="voter-name">' + voter.slug + '</div>' +
      '<div class="voter-choice">' + choice + '</div>';
    return row;
  }

  function addVote() {
    if (!POOL.length) return;
    var v = pickVoter();
    var c = pickChoice();
    var row = buildRow(v, c);
    listEl.insertBefore(row, listEl.firstChild);
    total += 1;
    totalEl.textContent = total;
    /* Trim the tail when over MAX_ROWS. */
    while (listEl.children.length > MAX_ROWS) {
      var oldest = listEl.lastElementChild;
      oldest.classList.add('fadeOut');
      (function (el) {
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 350);
      })(oldest);
      break;
    }
  }

  function schedule() {
    var ms = 1600 + Math.random() * 1800;
    setTimeout(function () { addVote(); schedule(); }, ms);
  }

  /* Pull the live snapshot, build the voter pool from streamers that
     have an avatar set. Then paint the initial 5 rows + start the
     ticker. If the fetch fails we leave the list empty rather than
     showing fake placeholder avatars — the design intent (real
     Kick avatars) is the whole point. */
  fetch(WORKER_LIVE_URL, { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (snap) {
      var chans = (snap && snap.channels) || {};
      POOL = Object.keys(chans)
        .filter(function (slug) { return chans[slug] && chans[slug].profile_pic; })
        .map(function (slug) {
          return { slug: slug, avatar: chans[slug].profile_pic };
        });
      if (!POOL.length) return;
      for (var i = 0; i < 5; i++) {
        var v = pickVoter();
        listEl.appendChild(buildRow(v, pickChoice()));
      }
      schedule();
    })
    .catch(function (err) {
      console.warn('[ticker] /live fetch failed:', err);
    });
})();
</script>
</body>
</html>
