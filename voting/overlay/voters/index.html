<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Empire X live-voters ticker — separate OBS browser source from
     the poll widget. Shows the most recent N votes as they land:
     Kick avatar + username + their choice. Each new vote slides
     in at the top with a soft entry animation; the oldest row
     fades out at the bottom. Designed to sit alongside (or below)
     the poll widget overlay during active polls.

     Suggested OBS size: 480 wide × 480 tall. Body is transparent
     so it composites cleanly. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="version" content="0.1.3">
<title>Empire X Voting — Live Voters</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap"></noscript>
<style>
  :root {
    --gold:       #D4A843;
    --gold-light: #F0D68A;
    --cream:      #F5F1EB;
    --cream-dim:  rgba(245,241,235,0.7);
    --green:      #53FC18;
    --red:        #FF4D4D;
    --hairline:   rgba(245,241,235,0.12);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    color: var(--cream);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 1.2rem;
  }

  /* === WIDGET CARD === */
  .ticker {
    width: 100%;
    max-width: 460px;
    background: linear-gradient(180deg, rgba(10,10,10,0.92) 0%, rgba(15,12,8,0.88) 100%);
    border: 1px solid rgba(212,168,67,0.4);
    border-radius: 14px;
    padding: 0.9rem 1rem 0.85rem;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.55), 0 0 24px rgba(212,168,67,0.18);
  }

  /* === HEAD === */
  .ticker-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.7rem;
    margin-bottom: 0.7rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--hairline);
  }
  .brand {
    display: flex; align-items: center; gap: 0.5rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.3em;
    color: var(--gold);
    text-shadow: 0 2px 4px rgba(0,0,0,0.7);
  }
  .brand img {
    width: 22px; height: 22px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
  }
  .brand span { color: var(--cream); margin-left: 0.4em; }
  .total {
    font-family: 'Oswald', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--cream-dim);
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
  }
  .total strong { color: var(--gold-light); font-weight: 600; }
  .live-dot {
    display: inline-block;
    width: 7px; height: 7px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--green);
    margin-right: 0.4em;
    vertical-align: middle;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* === LIST === */
  .voter-list {
    list-style: none;
    margin: 0;
    padding: 0;
    /* Limit height so the oldest entries scroll out cleanly. */
    max-height: 360px;
    overflow: hidden;
  }
  .voter-row {
    display: grid;
    grid-template-columns: 40px 1fr auto;
    gap: 0.7rem;
    align-items: center;
    padding: 0.45rem 0.1rem;
    border-bottom: 1px solid var(--hairline);
    /* Each row enters via slide-in from above. */
    animation: rowIn 0.42s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .voter-row:last-child { border-bottom: 0; }
  @keyframes rowIn {
    from { transform: translateY(-8px); opacity: 0; }
    to   { transform: translateY(0);     opacity: 1; }
  }
  /* When a row is leaving (fadeOut class added by JS) it eases out. */
  .voter-row.fadeOut {
    animation: rowOut 0.35s ease both;
  }
  @keyframes rowOut {
    to { transform: translateY(8px); opacity: 0; max-height: 0; padding: 0; border: 0; }
  }

  .voter-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2a2018, #1a1208);
    border: 1px solid var(--hairline);
    overflow: hidden;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .voter-avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .voter-name {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .voter-name small {
    display: block;
    font-weight: 400;
    font-size: 0.7rem;
    color: var(--cream-dim);
    letter-spacing: 0.04em;
    margin-top: 1px;
  }
  .voter-choice {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 0.78rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="ticker" id="ticker">
  <div class="ticker-head">
    <div class="brand">
      <img src="/logo.png" alt="">
      EMPIRE X<span>LIVE VOTES</span>
    </div>
    <div class="total">
      <span class="live-dot"></span><strong id="totalVotes">746</strong> total
    </div>
  </div>
  <ul class="voter-list" id="voterList">
    <!-- JS renders rows. Initial fill happens on first tick(). -->
  </ul>
</div>

<script>
/* =====================================================================
   Live voters ticker — prototype v0.1.3.

   v0.1.3 — voter pool now uses REAL Kick chatter names (mixed with
   plausibly-real handles). Avatars are pulled live from Kick via
   empire-worker's new /user/<slug> endpoint, which fetches the
   user's actual Kick profile_pic and caches it in the Cloudflare
   edge Cache API for 24 hours so the same name never re-hits Kick.

   When a username doesn't resolve to a Kick account (typo or made-up),
   we fall back to a generated avatar from ui-avatars.com -- same
   visual treatment Kick uses for users without a custom profile pic.

   In production this overlay reads avatar URLs off the vote document
   (captured from Kick OAuth profile_pic at sign-in time). Render
   path is the same; only the source of the URL changes.
===================================================================== */
(function () {
  var WORKER_USER_URL = 'https://empire-worker.sevendwarfs.workers.dev/user/';
  var CHOICES = ['Sky9 House', 'DTB House', 'Mixtapes House', 'Kozy House'];

  // Voter pool. The first three are real Kick chatters confirmed
  // to have profile pics; the rest are plausible viewer handles
  // (some may exist on Kick, some won't — the fallback handles
  // both cases).
  var USERNAMES = [
    // Confirmed-real Kick chatters:
    'SRTMarcus', 'bestfriend_x', 'baezyx',
    // Speculative — gets a real avatar if the name exists on Kick,
    // otherwise falls back to ui-avatars.com:
    'cobbruvs_fan22', 'EmpireSzn', 'shangelpolice', 'IRL_lurker',
    'kickwatcher', 'StreamGuy_98', 'midnightviewer', 'tunedin_2026',
    'user_28194', 'late_night_listener', 'longtimewatcher',
    'EmpireXlurker', 'PartyHouseFan', 'kozygrl', 'just_here_4_drama',
    'EmpireXdaily', 'gimme_clips', 'lurker_no_more', 'EmpireFirstTime',
    'dailyDTB', 'mixtapesQueen', 'voter_4_2_8'
  ];

  // ui-avatars fallback palette + builder (used when /user/<slug>
  // doesn't find a Kick account for the name).
  var PALETTE = [
    ['D4A843', '0a0a0a'], ['8B5CF6', 'ffffff'], ['EC4899', 'ffffff'],
    ['10B981', 'ffffff'], ['F59E0B', '0a0a0a'], ['3B82F6', 'ffffff'],
    ['EF4444', 'ffffff'], ['8B6620', 'F5F1EB'], ['06B6D4', '0a0a0a'],
    ['F472B6', '0a0a0a']
  ];
  function uiAvatar(name) {
    var hash = 0;
    for (var i = 0; i < name.length; i++) {
      hash = (hash * 31 + name.charCodeAt(i)) | 0;
    }
    var p = PALETTE[Math.abs(hash) % PALETTE.length];
    return 'https://ui-avatars.com/api/?bold=true&size=128&format=svg'
         + '&background=' + p[0]
         + '&color=' + p[1]
         + '&name=' + encodeURIComponent(name);
  }

  // Avatar cache: name -> URL. Starts with ui-avatars fallbacks so
  // the ticker can render immediately; gets upgraded with real Kick
  // URLs as the per-user fetches resolve. Already-rendered rows
  // self-update when their voter's real avatar arrives.
  var avatarCache = {};
  USERNAMES.forEach(function (name) {
    avatarCache[name] = uiAvatar(name);
  });

  // Background-upgrade real Kick avatars. Fire 'em all in parallel
  // — the worker caches each in the CF edge so this is a one-time
  // batch per cold browser session.
  USERNAMES.forEach(function (name) {
    fetch(WORKER_USER_URL + encodeURIComponent(name.toLowerCase()), { cache: 'no-cache' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.found && data.profile_pic) {
          avatarCache[name] = data.profile_pic;
          // Upgrade any already-rendered rows for this voter.
          document.querySelectorAll('[data-voter-name="' + cssEscape(name) + '"] .voter-avatar img').forEach(function (img) {
            if (img.src !== data.profile_pic) img.src = data.profile_pic;
          });
        }
      })
      .catch(function () { /* swallow — keep the ui-avatars fallback */ });
  });

  function cssEscape(s) {
    // Minimal escape for attribute-selector use; CSS.escape exists in
    // modern browsers but we keep this small for OBS browser sources
    // that might be running older Chromium builds.
    return String(s).replace(/(["\\])/g, '\\$1');
  }

  var listEl  = document.getElementById('voterList');
  var totalEl = document.getElementById('totalVotes');
  var MAX_ROWS = 6;
  var total = 746;

  function pickChoice() { return CHOICES[Math.floor(Math.random() * CHOICES.length)]; }
  function pickVoter()  { return USERNAMES[Math.floor(Math.random() * USERNAMES.length)]; }

  function buildRow(name, choice) {
    var row = document.createElement('li');
    row.className = 'voter-row';
    row.setAttribute('data-voter-name', name);
    row.innerHTML =
      '<div class="voter-avatar">' +
        '<img src="' + avatarCache[name] + '" alt="" loading="lazy" referrerpolicy="no-referrer">' +
      '</div>' +
      '<div class="voter-name">' + name + '</div>' +
      '<div class="voter-choice">' + choice + '</div>';
    return row;
  }

  function addVote() {
    var name = pickVoter();
    var choice = pickChoice();
    var row = buildRow(name, choice);
    listEl.insertBefore(row, listEl.firstChild);
    total += 1;
    totalEl.textContent = total;
    while (listEl.children.length > MAX_ROWS) {
      var oldest = listEl.lastElementChild;
      oldest.classList.add('fadeOut');
      (function (el) {
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 350);
      })(oldest);
      break;
    }
  }

  function schedule() {
    var ms = 1600 + Math.random() * 1800;
    setTimeout(function () { addVote(); schedule(); }, ms);
  }

  /* Paint initial 5 rows then start the ticker. Avatars start with
     ui-avatars fallbacks and self-upgrade to real Kick pics as the
     /user/<slug> fetches resolve. */
  for (var i = 0; i < 5; i++) {
    listEl.appendChild(buildRow(pickVoter(), pickChoice()));
  }
  schedule();
})();
</script>
</body>
</html>
